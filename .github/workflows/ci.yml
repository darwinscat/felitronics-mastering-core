# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

# The rows felitronics-core carried for these modules, plus the gates that only exist here: the lints run from
# this repository's root with their planted-violation controls, the wasm-audio tier for this suite, and every
# native-vs-wasm comparison of the two C ABIs. felitronics-core is fetched at FELITRONICS_MASTERING_FCORE_TAG
# (CMakeLists.txt): CI checks out this repository alone, so a green run proves the PIN — and it cannot be green
# before that core tag exists.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: the core-main row below catches a core change that breaks these modules
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # arm64 LINUX is the row that separates the ISA from Apple's toolchain (the macOS row is both at once);
        # it is where gcc's FP contraction first showed on this tree. Windows is MSVC and UCRT.
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_MASTERING_BUILD_TESTS=ON
      - name: Build
        shell: bash
        run: |
          n=$( (getconf _NPROCESSORS_ONLN || nproc || sysctl -n hw.ncpu) 2>/dev/null | head -1 )
          cmake --build build --config Release -j "${n:-4}"
      - name: Test
        shell: bash
        run: |
          n=$( (getconf _NPROCESSORS_ONLN || nproc || sysctl -n hw.ncpu) 2>/dev/null | head -1 )
          ctest --test-dir build -C Release --output-on-failure --no-tests=error -j "${n:-4}"

  # Against core's CURRENT main instead of the pin: the rows above prove the pinned core, and nothing on core's
  # side builds these modules any more, so a core change that breaks them is found here (nightly at the latest),
  # not at the next pin bump. The lints run too: this repository's zone stands on core's.
  core-main:
    name: against felitronics-core main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_MASTERING_BUILD_TESTS=ON -DFELITRONICS_MASTERING_FCORE_TAG=main
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j "$(nproc)"
      - name: det-math, both passes, against core main
        run: |
          CORE="$(sed -n 's/^FELITRONICS_MASTERING_CORE_SOURCE_DIR:INTERNAL=//p' build/CMakeCache.txt)"
          node "$CORE/tools/lint/check-det-math.mjs" --satellite

  sanitizers:
    name: ubuntu-clang-asan-ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure (ASan + UBSan, hard-fail on any UB)
        run: >
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          -DFELITRONICS_MASTERING_BUILD_TESTS=ON -DFELITRONICS_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-san -j "$(nproc)"
      - name: Test
        env:
          # LSan is Linux-only; this row is where leaks fail the build.
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure --no-tests=error -j "$(nproc)"

  # The newest GCC: ubuntu-latest defaults to g++-13, and gcc is what rejects -Wfloat-equal on a literal where
  # clang does not — the header-hygiene TU here is only as strict as the compiler that builds it.
  gcc14:
    name: ubuntu-gcc-14
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install g++-14
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Configure
        env: { CXX: g++-14, CC: gcc-14 }
        run: cmake -S . -B build-gcc14 -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_MASTERING_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-gcc14 -j 4
      - name: Test
        run: ctest --test-dir build-gcc14 --output-on-failure --no-tests=error -j "$(nproc)"

  lints:
    name: lints (core's, run from this root) + their controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch core (configure only)
        run: cmake -S . -B build -DFELITRONICS_MASTERING_BUILD_TESTS=OFF
      - name: det-math — core's pass and this repository's
        run: |
          CORE="$(sed -n 's/^FELITRONICS_MASTERING_CORE_SOURCE_DIR:INTERNAL=//p' build/CMakeCache.txt)"
          node "$CORE/tools/lint/check-det-math.mjs" --self-test
          node "$CORE/tools/lint/check-det-math.mjs" --satellite
      - name: One allocation counter
        # tools/ too: the ABI suites live under tools/tests.
        run: |
          CORE="$(sed -n 's/^FELITRONICS_MASTERING_CORE_SOURCE_DIR:INTERNAL=//p' build/CMakeCache.txt)"
          node "$CORE/tools/lint/check-alloc-counter.mjs" modules tools tests
      - name: No long double
        run: |
          CORE="$(sed -n 's/^FELITRONICS_MASTERING_CORE_SOURCE_DIR:INTERNAL=//p' build/CMakeCache.txt)"
          node "$CORE/tools/lint/check-no-long-double.mjs"
      - name: The gates still gate — negative controls, on THIS repository's files
        # The same controls core's CI runs against its own zone (its wasm-audio job), planted here on the files
        # that left it — each one is a way the lint could go quietly dead on THIS side. They also make the zone
        # file fail-closed: without tools/lint/det-math-zone.txt the lint would run with an empty zone (the state
        # of a repository that has none). This step then stops at once, because the zone file is one of the files
        # it copies aside; and past that, controls 6 and 9 would fail their expected reports (5 and 12 would still
        # see their plant, as a manifest line).
        # Planted files are copied aside and copied back, never `git checkout --`: someone will run this block
        # in a working tree with changes in it.
        run: |
          set -e
          CORE="$(sed -n 's/^FELITRONICS_MASTERING_CORE_SOURCE_DIR:INTERNAL=//p' build/CMakeCache.txt)"
          LINT="$CORE/tools/lint/check-det-math.mjs"
          ZONEH=modules/analysis_offline/include/felitronics/analysis/HumDetector.h
          MANH=modules/mastering/include/felitronics/mastering/MasteringChain.h
          MANIFEST=tools/lint/det-math-manifest.txt
          ZONEFILE=tools/lint/det-math-zone.txt
          SOLV=modules/mastering/include/felitronics/mastering/LoudnessSolver.h
          CORE_ZONEH="$CORE/modules/analysis/include/felitronics/analysis/ReferenceTruePeakMeter.h"
          PROBEH=tools/fcore_probe.h
          FILES=("$ZONEH" "$MANH" "$MANIFEST" "$ZONEFILE" "$SOLV" "$CORE_ZONEH" "$PROBEH")
          BK="$(mktemp -d)"
          for i in "${!FILES[@]}"; do cp "${FILES[$i]}" "$BK/$i"; done
          det_restore () { for i in "${!FILES[@]}"; do cp "$BK/$i" "${FILES[$i]}"; done; }
          det_control () {  # det_control <n> <what> <expected substring>
            if node "$LINT" --satellite > /dev/null 2>&1; then
              det_restore; echo "CONTROL FAILED ($1): the lint PASSED with $2 planted"; exit 1; fi
            node "$LINT" --satellite 2>&1 | grep -qF "$3" \
              || { det_restore; echo "CONTROL FAILED ($1): fired but did not report '$3'"; exit 1; }
            det_restore; echo "control $1 ok: $2 is caught"
          }
          printf '\nnamespace { inline double p80c (double x) { return std::cos (x); } }\n' >> "$ZONEH"
          det_control 5 "a direct std::cos in a deterministic-zone header" "$ZONEH"
          printf '\nnamespace { inline double p80c (double x) { return felitronics::core::gainToDb (x); } }\n' >> "$ZONEH"
          det_control 6 "a CARRIER call (core's gainToDb) in this repository's zone" "[CARRIER]"
          printf '\nnamespace { inline double p80c (double x) { return std::tanh (x); } }\n' >> "$MANH"
          det_control 7 "a new libm call in a manifested file" "the calls in this file CHANGED"
          printf 'modules/mastering/include/felitronics/mastering/Planes.h  [cos*1]  retain-local  planted\n' >> "$MANIFEST"
          det_control 8 "a stale manifest entry for a file with no calls" "no libm calls left"
          printf '\nnamespace { inline double p80c (double x) { return std::cos (x); } }   // libm-ok: unbacked\n' >> "$ZONEH"
          det_control 9 "a libm-ok marker with no exception entry behind it" "no entry for it in ZONE_EXCEPTIONS"
          # 10: this repository has no in-zone exception of its own, so the control plants the ALLOWANCE and
          # not the call — the rot check this side used to skip.
          printf 'exception  %s  cos*1  planted: an allowance with no marked call behind it\n' "$ZONEH" >> "$ZONEFILE"
          det_control 10 "an exception entry with no marked call behind it" "[ZONE-EXCEPTION-ROT]"
          # 11 is THE regression this lint was written after: reverting LoudnessSolver::peakDb to the
          # system spelling breaks "the solver's report IS the certificate, bit for bit". The first
          # version of the lint PASSED on it, because carrier calls were checked only inside the zone.
          sed -i 's|core::gainToDbDet (lin)|core::gainToDb (lin)|' "$SOLV"
          # And prove the mutation LANDED: an earlier version of this control keyed on `... : -200.0`,
          # which a refactor renamed to kPeakDbSilence, so the sed matched nothing and the lint's pass
          # read as a working gate. A stand that does not verify its own mutation is wired to nothing.
          grep -q 'core::gainToDb (lin)' "$SOLV" \
            || { det_restore; echo "CONTROL BROKEN (11): the sed planted nothing"; exit 1; }
          det_control 11 "LoudnessSolver::peakDb reverted to the system spelling" "$SOLV"
          printf '\nnamespace { inline double p80c (double x) { return std::cos\n    (x); } }\n' >> "$ZONEH"
          det_control 12 "a call split between its name and its parenthesis" "$ZONEH"
          printf 'zone  modules/analysis_offline/include/felitronics/analysis/NoSuchFile.h  planted\n' >> "$ZONEFILE"
          det_control 13 "a zone entry for a file that does not exist" "[ZONE-ROT]"
          # 14: the run from here is core's pass too — a violation in core's zone fails THIS repository's lint.
          printf '\nnamespace { inline double p80c (double x) { return std::cos (x); } }\n' >> "$CORE_ZONEH"
          det_control 14 "a std::cos in core's zone, seen from this repository" "ReferenceTruePeakMeter.h"
          # 15, 16: the zone file itself — a line it cannot read is an error, not a shorter list, and an entry
          # point that is not there empties rule 4's net.
          printf 'zones %s a misspelt keyword\n' "$ZONEH" >> "$ZONEFILE"
          det_control 15 "an unreadable zone-file line" "[LISTS]"
          printf 'entry  tools/wasm/no_such_entry.cpp  planted\n' >> "$ZONEFILE"
          det_control 16 "a parity entry point that does not exist" "[ZONE-ROT]"
          # 17: a file the parity closure reaches under an extension the directory walk does not take. It used
          # to be read by the closure and audited by nobody.
          printf 'inline double p80c (double x) { return std::cos (x); }\n' > tools/_lint_control.inc
          printf '\n#include "_lint_control.inc"\n' >> "$PROBEH"
          if node "$LINT" --satellite > /dev/null 2>&1; then
            rm -f tools/_lint_control.inc; det_restore; echo "CONTROL FAILED (17): a call in a reached .inc passed"; exit 1; fi
          node "$LINT" --satellite 2>&1 | grep -qF "_lint_control.inc" \
            || { rm -f tools/_lint_control.inc; det_restore; echo "CONTROL FAILED (17): fired but did not name the .inc"; exit 1; }
          rm -f tools/_lint_control.inc; det_restore; echo "control 17 ok: a call in a file only the closure reaches is caught"
          node "$LINT" --satellite > /dev/null \
            || { echo "CONTROL FAILED: the tree did not come back clean, so controls 5-17 proved nothing"; exit 1; }
          echo "controls 5-17 ok: the libm audit fires on every rule, on both sides, and the tree is clean again"
          # The other two lints reach this repository's files too.
          printf 'using Forbidden = long double;\n' > modules/mastering/include/felitronics/mastering/_lint_control.h
          if node "$CORE/tools/lint/check-no-long-double.mjs" > /dev/null 2>&1; then
            rm -f modules/mastering/include/felitronics/mastering/_lint_control.h
            echo "CONTROL FAILED: a long double in a module header did not fail the lint"; exit 1
          fi
          rm -f modules/mastering/include/felitronics/mastering/_lint_control.h
          echo "control 3 ok: the long-double lint reaches this repository's headers"
          printf 'void* operator new (unsigned long s);\n' > tools/tests/_lint_control.cpp
          if node "$CORE/tools/lint/check-alloc-counter.mjs" modules tools tests > /dev/null 2>&1; then
            rm -f tools/tests/_lint_control.cpp
            echo "CONTROL FAILED: a private operator new did not fail the lint"; exit 1
          fi
          rm -f tools/tests/_lint_control.cpp
          node "$CORE/tools/lint/check-alloc-counter.mjs" modules tools tests > /dev/null
          echo "control 5a ok: the alloc-counter lint reaches this repository's ABI suites"

  # The wasm-audio tier for THIS repository's suite (core's preset flags and toolchain pin), its artifact
  # gates, and every native-vs-wasm comparison of the two C ABIs. ubuntu, NOT macos, and for the comparisons
  # that is load-bearing: Apple's libm and musl (what emscripten compiles in) return different doubles from
  # tan() at 88.2 and 192 kHz, so an arm64-macOS reference would diverge from wasm for a reason that is not a
  # regression. glibc agrees with musl at every rate measured. docs/WASM-SPIKE.md has the numbers.
  wasm:
    name: wasm-audio tier + native-vs-wasm parity (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Nightly (and on demand) also against core's CURRENT main: the pinned row proves the pin, and a core
        # change that moves a byte on one road and not the other would otherwise wait for the next pin bump.
        core: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["pin","main"]' || '["pin"]') }}
    env:
      CORE_TAG: ${{ matrix.core == 'main' && '-DFELITRONICS_MASTERING_FCORE_TAG=main' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install emsdk 6.0.9
        # From upstream, pinned on the CLONE as well as the SDK version, as in core's CI.
        run: |
          git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.9
          "$HOME/emsdk/emsdk" activate 6.0.9
          source "$HOME/emsdk/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "PATH=$PATH"   >> "$GITHUB_ENV"
      - name: Configure + build the tier
        run: cmake --preset wasm-audio $CORE_TAG && cmake --build --preset wasm-audio -j "$(nproc)"
      - name: Run the suite in node
        run: ctest --preset wasm-audio -j "$(nproc)" --no-tests=error
      - name: No threads — audited on EVERY emitted .wasm
        run: |
          CORE="$(sed -n 's/^FELITRONICS_MASTERING_CORE_SOURCE_DIR:INTERNAL=//p' build-wasm-audio/CMakeCache.txt)"
          node "$CORE/tools/wasm/check-no-threads.mjs" --all build-wasm-audio
      - name: No threading header in a public module header
        # The .wasm audit cannot see std::mutex: it lives inside libc++-noexcept.a and its stub succeeds.
        run: |
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(thread|mutex|shared_mutex|condition_variable|future|latch|barrier|semaphore|stop_token)>' modules/*/include; then
            echo "^^ the wasm-audio tier is single-threaded by contract (felitronics-core DSP-ARCHITECTURE.md 2)"; exit 1
          fi
          echo "no threading headers in public module headers"
      - name: No long double arithmetic in any emitted object — law 9, from the ARTIFACT
        run: |
          NM="$EMSDK/upstream/bin/llvm-nm"
          if find build-wasm-audio -name '*.o' -print0 \
             | xargs -0 "$NM" --undefined-only --print-file-name \
             | grep -E ' U (__(add|sub|mul|div|neg|extend[sd]f|trunc|fix|float|eq|ne|lt|le|gt|ge|unord)tf[0-9a-z]*|(sqrt|pow|exp|log|sin|cos|tan|fabs|floor|ceil|fmod|hypot|fma)l)$'; then
            echo "^^ a wasm32 long double operation is a compiler-rt libcall — law 9."; exit 1
          fi
          echo "no long double arithmetic in any emitted object"
      - name: Checked build — SAFE_HEAP + assertions + stack-overflow checks
        # Excluded: the three exhaustive sweeps (two mastering, one clip detector). Under SAFE_HEAP they are the
        # whole tail of this step, each alone on a core for over four minutes, because one test cannot be split
        # by -j. They add nothing here: the same sweeps already ran above for their numbers, and natively under
        # ASan for memory safety, which is the stronger instrument.
        run: |
          cmake --preset wasm-audio -B build-wasm-checked $CORE_TAG -DFELITRONICS_WASM_ASSERTIONS=2 \
                -DCMAKE_EXE_LINKER_FLAGS="-sSAFE_HEAP=1 -sSTACK_OVERFLOW_CHECK=2"
          cmake --build build-wasm-checked -j "$(nproc)"
          ctest --test-dir build-wasm-checked -j "$(nproc)" --output-on-failure --no-tests=error -E 'delivered_ceiling|loudness_solver|clip_detector'
      - name: The native references — the CLIs every comparison below diffs against
        # Configured once, here, and the core it fetched is the core the wasm modules are built against in the
        # next step: two fetches of one tag are one tree, but "the same core" should be a fact of the run, not
        # of the tag.
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_MASTERING_BUILD_TESTS=OFF $CORE_TAG
          cmake --build build-native -j "$(nproc)" --target fcore_measure fcore_master
      - name: The wasm modules build (tools/wasm/build.sh)
        run: |
          export FELITRONICS_CORE_DIR="$(sed -n 's/^FELITRONICS_MASTERING_CORE_SOURCE_DIR:INTERNAL=//p' build-native/CMakeCache.txt)"
          test -n "$FELITRONICS_CORE_DIR"
          ./tools/wasm/build.sh
      - name: NULL test — native vs wasm, bit-exact, on a GENERATED fixture
        # No private audio in a public repo: the fixture is synthesised from an integer PRNG with no
        # transcendental in sight, so it is byte-identical on any engine. The comparison surface is the
        # pre-gate 400 ms block-energy vector, not the scalar LUFS — a gated scalar is discontinuous in its
        # own inputs and cannot carry a bit-exactness claim (docs/WASM-SPIKE.md). The checked artifact
        # (SAFE_HEAP + ASSERTIONS=2 + stack checks) is diffed too: building it without running it would
        # prove nothing, and the libsoxr precedent is exactly a clean build that died at runtime.
        run: |
          node tools/wasm/make-fixture.mjs fixture.f32 48000 2 10
          # The generator claims to be deterministic by construction; this turns that into a MEASURED fact
          # on a different machine, OS and node build than the one it was written on. Recorded from two
          # local runs on macOS/arm64. If a future edit to the generator changes the signal, this line is
          # what says so, instead of every report quietly citing a different "97 block energies".
          echo "ad4b9513d9d9b88827a07116d36ceafa5c73a7602239c8e4ff6d49c6e2beac39  fixture.f32" | sha256sum -c -
          ./build-native/tools/fcore_measure blocks 48000 2 fixture.f32 > native.txt
          node tools/wasm/parity.mjs tools/wasm/build/fcprobe.node.js  48000 2 fixture.f32 > wasm.txt
          node tools/wasm/parity.mjs tools/wasm/build/fcprobe.debug.js 48000 2 fixture.f32 > wasm-checked.txt
          diff native.txt wasm.txt
          diff native.txt wasm-checked.txt
          echo "bit-identical: $(sed -n 's/^blocks //p' native.txt) block energies + true peak + sample peak"
      - name: NULL test — waveform peaks, stereo band and needle, native vs wasm, bit-exact
        # The page's waveform and stereo pictures and the sidecars that stand in for them now come from one
        # definition (analysis::WaveformPeaks / StereoColumns via fcore::ShapeProbe), and this is the proof the
        # two roads to it — the native CLI a server would run and the browser module — draw the same bits. Every
        # mix mode; bucket and column counts that are the page's (1000, 1100), the spec's default (1200), one, and
        # more than the frames hold; a mono, a stereo and a six-channel fixture at three rates; the needle over the
        # whole file, a stretch, one frame and an empty stretch. Release and checked artifacts both.
        run: |
          node tools/wasm/make-fixture.mjs fix6.f32 44100 6 3
          node tools/wasm/make-fixture.mjs fix1.f32 22050 1 2
          M=./build-native/tools/fcore_measure
          n=0
          check() { f=$1; sr=$2; ch=$3; mode=$4; shift 4
            $M "$mode" "$sr" "$ch" "$f" "$@" > shapes-native.txt
            test -s shapes-native.txt
            for mod in fcprobe.node.js fcprobe.debug.js; do
              node tools/wasm/shapes-parity.mjs "tools/wasm/build/$mod" "$mode" "$sr" "$ch" "$f" "$@" > shapes-wasm.txt
              diff shapes-native.txt shapes-wasm.txt || { echo "DIFFER: $mode $sr $ch $* ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          for mix in avr L R max; do for b in 1 1000 1100 100000; do
            check fixture.f32 48000 2 waveform --buckets $b --mix $mix
            check fix6.f32    44100 6 waveform --buckets $b --mix $mix
            check fix1.f32    22050 1 waveform --buckets $b --mix $mix
          done; done
          for c in 1 1100 1200 50000; do
            check fixture.f32 48000 2 stereo --columns $c
            check fix6.f32    44100 6 stereo --columns $c
            check fix1.f32    22050 1 stereo --columns $c
          done
          check fixture.f32 48000 2 needle
          check fixture.f32 48000 2 needle --from 12345 --to 400000
          check fix6.f32    44100 6 needle --from 7 --to 8
          check fix1.f32    22050 1 needle --from 100 --to 100
          echo "bit-identical: $n native-vs-wasm comparisons of peaks, stereo band and needle"
      - name: NULL test — the clipped runs, native vs wasm, bit-exact
        # analysis::ClipDetector now has a way out (fcore::ClipProbe, `fcore_measure clips` and
        # fc_probe_clips_*), and this is the proof the two roads report the same runs. The generated fixture
        # above is CLEAN — its flat stretches are square waves and a hit that stops, which the detector
        # correctly reports as clipping-free — so it is kept as the zero-run case and a second, CLAMPED
        # generator provides the runs. Both are transcendental-free and their bytes are pinned.
        #
        # --chunk IS THE LAW-8a HANDLE. It is honoured by the native tool and ignored by the module (which
        # always measures in one call), so every row below that carries it compares an N-sample-at-a-time
        # native run against a whole-buffer wasm run: re-slicing invariance and cross-toolchain identity in
        # the same diff. Without it both sides cut the stream at multiples of fcore::ClipProbe::kChunk and the
        # comparison would say nothing at all about slicing.
        run: |
          node tools/wasm/make-clip-fixture.mjs clipfix.f32  48000 2 2
          node tools/wasm/make-clip-fixture.mjs clipfix6.f32 44100 6 1
          node tools/wasm/make-clip-fixture.mjs clipfix1.f32 22050 1 1
          # Deterministic by construction, turned into a measured fact on another machine, OS and node build.
          # The generator's passages are fractions of the length, so even the 1-second fixtures carry all
          # seven: quiet noise, silence, a hard clamp, a clean passage, a shallow clamp, non-finite HOLES
          # (150 / 191 / 17 of them here) and a clamped tail whose runs exist only after finish().
          sha256sum -c - <<'SUMS'
          fab7d41e1925e58f58462e39b7c2481dc0418b5aa28cc0b4203f3c6a710f955f  clipfix.f32
          91de246c7f8f6fc98df1957762c87c50fbc8fda87abddff974753ef7d19ecc85  clipfix6.f32
          b0e173a8d8f0732b0882425367f8065b11ed986b925c6a49b99aa4b32ece7171  clipfix1.f32
          SUMS
          M=./build-native/tools/fcore_measure
          n=0
          check() { f=$1; sr=$2; ch=$3; shift 3
            $M clips "$sr" "$ch" "$f" "$@" > clips-native.txt
            test -s clips-native.txt
            for mod in fcprobe.node.js fcprobe.debug.js; do
              node tools/wasm/clips-parity.mjs "tools/wasm/build/$mod" clips "$sr" "$ch" "$f" "$@" > clips-wasm.txt
              diff clips-native.txt clips-wasm.txt || { echo "DIFFER: clips $sr $ch $f $* ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          # AND THE REFUSALS MUST MATCH TOO. A byte diff of two successful commands says nothing about the
          # command lines both sides are supposed to REJECT, and a domain mismatch there is a silent
          # disagreement: `--max-runs 4294967296` wrapped to 0 in a uint32_t parameter and came back as a
          # cheerful `maxruns=0` report from the module while the native tool exited 2. Both sides must refuse,
          # both must print nothing to stdout.
          refuse() { f=$1; sr=$2; ch=$3; shift 3
            if $M clips "$sr" "$ch" "$f" "$@" > r-native.txt 2>/dev/null; then
              echo "NATIVE ACCEPTED what it should refuse: clips $sr $ch $f $*"; exit 1; fi
            test ! -s r-native.txt || { echo "NATIVE printed a report and then failed: $*"; exit 1; }
            for mod in fcprobe.node.js fcprobe.debug.js; do
              if node tools/wasm/clips-parity.mjs "tools/wasm/build/$mod" clips "$sr" "$ch" "$f" "$@" \
                   > r-wasm.txt 2>/dev/null; then
                echo "WASM ACCEPTED what native refuses: clips $sr $ch $f $* ($mod)"; exit 1; fi
              test ! -s r-wasm.txt || { echo "WASM printed a report and then failed: $* ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          # a file with NO clipping at all, then clamped material at three rates and three widths
          check fixture.f32   48000 2
          check clipfix.f32   48000 2
          check clipfix6.f32  44100 6
          check clipfix1.f32  22050 1
          # the detector's own capacity running out: the count keeps counting, the list says it is short
          # 1051 is this fixture's exact run count, so 1050/1051 straddles the completeness boundary
          for c in 0 1 3 500 1050 1051 1052; do check clipfix.f32 48000 2 --max-runs $c; done
          # re-slicing, across the tier
          for k in 1 2 3 7 959 960 961 8191 8192; do check clipfix.f32 48000 2 --chunk $k; done
          for k in 1 7 882; do check clipfix6.f32 44100 6 --chunk $k; check clipfix1.f32 22050 1 --chunk $k; done
          refuse clipfix.f32 48000 2 --max-runs 4294967296
          refuse clipfix.f32 48000 2 --max-runs 1048577
          refuse clipfix.f32 48000 2 --chunk 2147483648
          refuse clipfix.f32 48000 2 --max-runs 5 --max-runs 6
          refuse clipfix.f32 48000 2 --bogus 1
          refuse clipfix.f32 48000 2 --max-runs
          refuse clipfix.f32 48000 0
          refuse clipfix.f32 48000 17
          # THE RATE FLOOR, FROM BOTH SIDES (the core's 8000 Hz sample-rate floor; it was 1000 here, with `999` the row).
          # The refusal rows see the floor move down; they cannot see it move UP, so 8000 itself is a comparison
          # that must produce a report. 44.1 is the mistake the floor exists for: kilohertz passed as hertz.
          refuse clipfix.f32 7999 2
          refuse clipfix.f32 7999.999999999999 2
          refuse clipfix.f32 44.1 2
          refuse clipfix.f32 1000 2
          check  clipfix.f32 8000 2
          refuse clipfix.f32 768001 2
          refuse clipfix.f32 0 2
          : > empty.f32 && refuse empty.f32 48000 2
          echo "bit-identical: $n native-vs-wasm comparisons of the clipped runs, refusals included"

      - name: NULL test — the streaming surface, native vs wasm, bit-exact
        # The fc_stream_* handles (fcore::StreamProbe: the deterministic loudness meter and the clip detector, fed
        # piece by piece and read between the pieces) against `fcore_measure stream`, which drives the same class
        # without the ABI. Every line after every piece is compared: momentary, short-term and integrated LUFS as
        # bit patterns, the samples consumed, and the runs decided so far — then finish() and the runs only it
        # decides. The native reference is this job's contract-off fcore_measure; fcore_master is not a reference,
        # it is built with contraction, and the detector's run existence depends on it.
        #
        # 88200 IS THE ROW THAT MATTERS. The system-libm meter (the one fc_probe_run still uses) gives different
        # block energies natively and in wasm there; the deterministic one must not. 44100 and 48000 beside it.
        run: |
          set -euo pipefail
          for sr in 44100 48000 88200; do
            node tools/wasm/make-fixture.mjs      "stream-fix$sr.f32"  "$sr" 2 10
            node tools/wasm/make-clip-fixture.mjs "stream-clip$sr.f32" "$sr" 2 2
          done
          sha256sum -c - <<'SUMS'
          00b8afdc735b206b80ba349fd64afc81052f5c45477ed64c540ddf7f3f630bd3  stream-fix44100.f32
          ad4b9513d9d9b88827a07116d36ceafa5c73a7602239c8e4ff6d49c6e2beac39  stream-fix48000.f32
          c6d50a1b6a60b07b4ccc0531269a4d8f770de12378e02bf2b84021f101d00c1a  stream-fix88200.f32
          df41196bcac8e77c9e5eecee7b0a807ad672ed76733d63723eee63a37da65c3f  stream-clip44100.f32
          fab7d41e1925e58f58462e39b7c2481dc0418b5aa28cc0b4203f3c6a710f955f  stream-clip48000.f32
          2043d1f4c2346cab191e380c931fdaac4786575d9e7995a4d570cbbeaa7f81aa  stream-clip88200.f32
          SUMS
          M=./build-native/tools/fcore_measure
          n=0
          check() { f=$1; sr=$2; shift 2
            $M stream "$sr" 2 "$f" "$@" > stream-native.txt
            test -s stream-native.txt
            # A clean diff of silence proves nothing: the integrated reading must not be the -120 floor.
            ! grep '^at ' stream-native.txt | tail -1 | grep -q ' i c05e000000000000 ' \
              || { echo "integrated is the -120 floor on $f — the comparison is comparing nothing"; exit 1; }
            for mod in fcprobe.node.js fcprobe.debug.js; do
              node tools/wasm/stream-parity.mjs "tools/wasm/build/$mod" stream "$sr" 2 "$f" "$@" > stream-wasm.txt
              test -s stream-wasm.txt
              diff stream-native.txt stream-wasm.txt || { echo "DIFFER: stream $sr $f $* ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          for sr in 44100 48000 88200; do
            for k in 4096 4095 $((sr / 100)) 100000; do
              check "stream-fix$sr.f32"  "$sr" --chunk "$k"
              check "stream-clip$sr.f32" "$sr" --chunk "$k"
              # the clamped fixture must have runs, and runs that only finish() decides
              grep -q '^run ' stream-native.txt || { echo "no runs on stream-clip$sr.f32"; exit 1; }
              before=$(grep '^at ' stream-native.txt | tail -1 | sed 's/.* runs //')
              after=$(sed -n 's/^finish runs //p' stream-native.txt)
              [ "$after" -gt "$before" ] || { echo "finish() decided no runs on stream-clip$sr.f32 ($before -> $after)"; exit 1; }
            done
          done
          echo "bit-identical: $n native-vs-wasm comparisons of the streaming surface, read after every piece"

      - name: the five offline analyzers — native vs wasm, byte for byte
        run: |
          set -euo pipefail
          # WHY THIS GATE CAN EXIST AT ALL. Before the deterministic floor (core::det) it could not: the five analyzers computed their
          # windows, dB values and thresholds through the SYSTEM libm, which is not the same function on
          # every row — 4032 of 131072 Hann coefficients differ between Apple's libm and musl's at order
          # 17, and 41 % of pow10 results over the dB range these thresholds live in. A byte diff of the
          # two rows was therefore unattainable for hum, lowend and forensics, and the acceptance had been
          # weakened to a wasm-only comparison. core::det made the original criterion reachable, so it is
          # the one enforced here.
          node tools/wasm/make-fixture.mjs fixture441.f32 44100 2 10   # 48 kHz one already exists above
          # AND A PROGRAMME THAT ACTUALLY HAS HUM. On the loudness fixture HumDetector finds zero quiet
          # frames and returns NoQuietStretch before reaching its peak search at all: 47 lines of "nothing
          # found" satisfy `test -s` and diff clean without the measurement path ever running. This one
          # carries a 50 Hz line with three harmonics in two quiet stretches, each longer than a whole
          # analysis window plus a hop — which is what it takes for a frame to sit entirely inside one.
          node tools/wasm/make-hum-fixture.mjs humfix.f32 48000 2 30
          M=./build-native/tools/fcore_measure
          n=0
          check() { mode=$1; sr=$2; ch=$3; f=$4
            $M "$mode" "$sr" "$ch" "$f" > an-native.txt
            # A clean diff of two empty files proves nothing: refuse to count a comparison with no content.
            test -s an-native.txt
            for mod in fcprobe.node.js fcprobe.debug.js; do
              node "tools/wasm/$mode-parity.mjs" "tools/wasm/build/$mod" "$sr" "$ch" "$f" > an-wasm.txt
              test -s an-wasm.txt
              diff an-native.txt an-wasm.txt || { echo "DIFFER: $mode $sr $ch $f ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          # Both rates matter and not for symmetry: at 44.1 kHz the filter arguments of these analyzers
          # (30 Hz, 9 kHz, the K-weighting corner) are ones where the system libm's tan DID differ between
          # rows, so this is the rate that would have caught a regression in the deterministic floor.
          for mode in report forensics hum lowend bursts stereobursts excursions; do
            check "$mode" 48000 2 fixture.f32
            check "$mode" 44100 2 fixture441.f32
          done
          # AND THE STEREO BAND BURSTS ASSERTED TO HAVE FIRED ON BOTH AXES. A stereo instrument whose fixture happens to be
          # centred has an exactly zero Side, no eligible hop and no event on it — and two such reports
          # diff clean while the cross arithmetic, which is the whole point of the class, never runs. This
          # is the same trap the hum check below names, one axis over.
          $M stereobursts 48000 2 fixture.f32 > an-native.txt
          grep -qE '^axis 0 [0-9]+ [0-9]+ [0-9]+ [0-9]+ 1 0 [1-9]' an-native.txt \
            || { echo "the stereobursts fixture stopped firing on Mid — the gate is comparing nothing"; exit 1; }
          grep -qE '^axis 1 [0-9]+ [0-9]+ [0-9]+ [0-9]+ 1 0 [1-9]' an-native.txt \
            || { echo "the stereobursts fixture stopped firing on Side — the cross reading is untested"; exit 1; }
          grep -qE '^e 1 ' an-native.txt \
            || { echo "no Side event row — crossAt() is not exercised by this gate"; exit 1; }
          # hum again, on the programme that reaches its measurement — and asserted to be a real finding,
          # because a clean diff of two "nothing found" reports is the shape this whole gate exists to
          # refuse.
          check hum 48000 2 humfix.f32
          grep -q '^ch 0 valid 1 reason 0 mains 1' an-native.txt \
            || { echo "the hum fixture stopped finding its line — the gate is comparing nothing again"; exit 1; }
          # BandCrest: the harness came with the others and was never run. Single programme at both rates and on
          # the hum fixture, and PAIRED (--against), which is the loss the class exists to report.
          check crest 48000 2 fixture.f32
          check crest 44100 2 fixture441.f32
          check crest 48000 2 humfix.f32
          # The pair must LOSE something, or the comparison is of zeros: make-fixture.mjs is deterministic, so a
          # second programme from it is the same bytes. The clamped generator gives a master that really lost
          # crest, and a loss field that is not zero is asserted before anything is compared.
          node tools/wasm/make-clip-fixture.mjs crest-clamped.f32 48000 2 10
          $M crest 48000 2 fixture.f32 --against crest-clamped.f32 > an-native.txt
          grep -E '^loss ' an-native.txt | awk '$6 != "0000000000000000"' | grep -q . \
            || { echo "the paired crest reports no loss — the gate is comparing zeros"; exit 1; }
          for mod in fcprobe.node.js fcprobe.debug.js; do
            node tools/wasm/crest-parity.mjs "tools/wasm/build/$mod" 48000 2 fixture.f32 --against crest-clamped.f32 > an-wasm.txt
            diff an-native.txt an-wasm.txt || { echo "DIFFER: crest --against ($mod)"; exit 1; }
            n=$((n+1))
          done
          echo "bit-identical: $n native-vs-wasm comparisons across the offline analyzers, two rates, two modules"

      - name: the price of a measurement — the same demand on both tiers
        # `fc_probe_<mode>_storage_bytes` publishes what each analyzer's storageFor() is about to ask the
        # heap for, so a page can decide BEFORE the allocation that -fno-exceptions turns into an abort.
        # Two things are checked here that the native suite structurally cannot:
        #   * that the five names reached the ARTIFACT. felitronics_analysis_abi_tests compiles
        #     fc_probe.cpp natively; an export missing from the module leaves it green and the page holding
        #     `undefined`, and `cmp` cannot detect a function nobody called.
        #   * that the two TIERS agree on the number. wasm32 has its own std::size_t and its own struct
        #     layouts, so this is a cross-tier oracle — a release-vs-checked diff of one tier would happily
        #     compare a wrong demand with itself.
        run: |
          set -euo pipefail
          # build-native was configured with tests OFF (it only needed fcore_measure); turning them on
          # re-uses its object cache and adds this one target.
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_MASTERING_BUILD_TESTS=ON $CORE_TAG
          cmake --build build-native -j "$(nproc)" --target felitronics_analysis_abi_tests
          ./build-native/tools/felitronics_analysis_abi_tests --storage-table > storage-native.txt
          test -s storage-native.txt
          # A table of nothing but refusals would compare clean and say nothing, which is the shape this
          # repository keeps catching. Floors, not equalities, so the grid may grow — but it may not
          # shrink: 571 rows today, of which 329 are priced (the stereo band bursts added 95 rows, 44 of them priced). (When the rate floor moved to 8000 Hz, the 1000 Hz
          # rows went to zero, the 2000 Hz rows left the grid, and 7999 / 12000 / 16000 joined — 425 / 280 before.)
          [ "$(wc -l < storage-native.txt)" -ge 570 ] \
            || { echo "the storage table lost rows — a smaller grid still compares clean"; exit 1; }
          [ "$(grep -cv ' 0$' storage-native.txt)" -ge 328 ] \
            || { echo "the storage table is mostly refusals — it is comparing nothing"; exit 1; }
          for mod in fcprobe.node.js fcprobe.debug.js; do
            node tools/wasm/storage-probe.mjs "tools/wasm/build/$mod" table > storage-wasm.txt
            cmp storage-native.txt storage-wasm.txt || { echo "the published demand differs between tiers ($mod)"; exit 1; }
            node tools/wasm/storage-probe.mjs "tools/wasm/build/$mod" check
          done
          echo "identical on both tiers: $(wc -l < storage-native.txt) rows of published demand, release and checked"

      - name: the mastering ABI — native vs wasm, within its stated tolerance
        # NOT byte for byte, and that is the contract rather than a concession: fcore_master is the reference
        # for the C++ API a desktop build links, so it takes the tree's -ffp-contract=on, while baseline wasm
        # has no scalar FMA to contract with — the same programme at two roundings. master-parity.mjs holds
        # the rendered audio to 1e-5 and the reported loudness to 1e-3 dB, with the integers exact, on both
        # paths of the ABI (streaming and the search) and on the delivering handle at a down- and an
        # upsample; its header says why each number is what it is. Bit-exactness of the ABI against a direct
        # C++ call is `fcore_master selftest`, in the suite above.
        #
        # On the two generated programmes above that make the chain WORK — its own precondition refuses a
        # comparison where every stage's trace is idle. NOT on the clip fixture: its non-finite holes are what
        # the analyzers must survive, and the chain's statistics and its LRA refuse them, as they should.
        run: |
          set -euo pipefail
          node tools/wasm/master-parity.mjs tools/wasm/build/fcmaster.node.js ./build-native/tools/fcore_master 48000 2 fixture.f32
          node tools/wasm/master-parity.mjs tools/wasm/build/fcmaster.node.js ./build-native/tools/fcore_master 48000 2 humfix.f32
