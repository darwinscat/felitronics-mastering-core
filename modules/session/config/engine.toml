#
# THE ENGINE — every number the mastering session decides, measures, renders and reports with, besides the targets
# (targets.toml). Compiled into felitronics::session at build time and read by schema, like the targets: an unknown key,
# a wrong type or a value outside its range stops the build at its line and column.
#
# What each number means and where it came from stands beside it. "An owner decision" is a number the owner chose, pinned
# by the decisions suite (modules/session/tests/ConfigDecisionsTests.cpp); "measured" is a measurement on real programme;
# "a hypothesis" is a starting value no measurement has confirmed yet. The schema checks form and physical domains only,
# so an owner decision changes by an edit of that suite, not by a schema error.
#
# A section is a device of the session ([hpf], [monoBass], [glue], [limiter], …) or a stage of its work ([input],
# [landing], [cost], [progress]). The travels of the knobs a person turns are OUR numbers — taste and the physics of the
# medium. The core's domains (what a stage accepts at all) are the core's and are not copied here.

# The name of this set of defaults. A project records it, never the defaults themselves. A project of this set keeps
# its machine's layer; one of another set is converted — a person's values and the target's numbers kept, the machine's
# layer placed again by the planner (no earlier set is carried).
defaults = "2026-10"

# THE INPUT, BEFORE THE CHAIN.
# referenceLufs (an owner decision): the input is brought to this loudness ahead of every stage, so a device whose
#   threshold is in dB decides the same whatever level the file arrived at, and a project carries over to another copy
#   of the file. −18 LUFS is about −15 dBFS RMS on music: where the devices' thresholds are meant to sit, with headroom
#   above for the peaks. The report states only what was done: the lift from the input to the result.
# quiet (an owner decision): below warningLufs the input is probably a mixing or export mistake, and a warning says so;
#   the machine works as usual. Below gainOnlyLufs the machine sets the gain and the ceiling and places no device — no
#   mono bass, no glue on cd, no low shelf, no peak clipper: no measurement is reliable at that level — but for the
#   high-pass, which stands always (owner decision 3.3) and takes its floor there. A person may still switch them on.
# shortSeconds (owner decision 3.2): a programme shorter than this is a sketch — its lowest note is not sought, and the
#   high-pass takes the target's floor. The former "trust a short file's note half as much" is gone.
[input]
referenceLufs = -18
quiet = { warningLufs = -40, gainOnlyLufs = -55 }
shortSeconds = 10

# THE LANDING — the loudness solver moving the gain before the limiter until the master sits on the target, in ONE
# render at the delivery rate.
# passes (owner decision, 28.09): one budget of twelve renders. Success stops immediately; a miss is a normal
#   outcome and delivers the closest measured master whose reference true peak holds the target ceiling.
# toleranceLu: a master within ±toleranceLu of the target has landed. The ceiling has no positive tolerance.
# truePeakAimDb: how far below the promised peak the feedback loop aims; distinct from the limiter's initial margin.
# The first gain uses the measured input's normalization to referenceLufs and the target's difference from it.
# LOUDNESS IS A REQUEST, NOT AN ORDER (owner decision, 04.10): better to fall short of the target than to reach it and
#   make the master unlistenable. A landing held short says so, with both numbers.
# onSourceGate (owner decision, 04.10): the level landed on the target is the louder of the file's BS.1770 reading and
#   the master's level over the 400 ms blocks the SOURCE's BS.1770 gate admitted, not gated again — the quiet parts the
#   drive lifts do not join the average, so they do not make the loud part pay for them, and the file never reads louder
#   than the level landed. The master's blocks take the source's readings by time; rates that are not whole hertz land
#   on the master's own gate. Where the two part by more than toleranceLu, either way round, the report says both.
# limiterBudget (owner decision, 04.10): the most the limiter may take, the P95 of its gain reduction over its ACTIVE
#   windows (input above [cost] limiterActiveInputDb, so silence does not water it down) — the number the report's
#   limiter line prints — by the loudness of the target, a person's edited number included: quietDb below middleLufs,
#   middleDb within it (both ends), loudDb above it, in dB on a quarter-dB step (the proof's resolution). A landing that
#   would need more stops where the budget holds and is delivered short of the target, the budget named — named only
#   where the render delivered stands within 0.25 dB of drive under one measured over the budget.
#   loudDb = 7.5 (owner decision, 04.10, v0.14.1; it was 10): 1058 renders of 23 songs without a budget put the
#   limiter's cost and the PEAQ damage breaking together near 4, 6.5 and 8 dB of P95. Asked for −6 LUFS, the median song
#   at 7.5 dB reaches −7.83 with an ODG of −1.46, 3 of 23 "annoying"; at 10 dB it reached −7.36, −2.30, 11 of 23.
[landing]
passes = 12 # Owner decision 28.09: one budget, stop on success; a miss is a normal result.
toleranceLu = 0.1
truePeakAimDb = 0.05
onSourceGate = true
limiterBudget = { quietDb = 4, middleDb = 7, loudDb = 7.5, middleLufs = [-10, -8] }
# The wall (owner, 05.10): stop a manual landing when a dB more of active P95 cut buys less than 0.2 LU.
# Compare existing passes at least 0.5 dB of P95 apart; no extra pass. The 23-song ladder puts this near 7.7 dB P95,
# around −8 LUFS: better a little quieter than broken. Max modes keep their own budgets below the knee.
limiterSlopeBelow = 0.2
limiterSlopeSpacingDb = 0.5

# THE MAX MODES (owner decisions, 04.10: v0.15.0, and v0.16.0 by ear). A target whose loudnessMode names one (targets.toml,
# or a person's edit of it) lands as loud as the mode's limiter budget allows — the active-window P95, as limiterBudget, in
# place of the rule by the target's loudness — up to ceilingLufs: a landing and a delivery, as a manual master's. Its
# damage is graded as any master's, when the shell asks (command::GradeDamage); v0.15.0's PEAQ guard before delivery is
# out of the loop (owner: both modes went too far by ear while PEAQ heard nothing). The budgets, from the budget-curve
# ladder (allStreaming, TP −1), medians of the home mixes / the Cambridge corpus:
#   clean   budget 0.5 dB — −13.05 / −12.04 LUFS, a little above streaming
#   dense   budget 1.75 dB — −11.22 / −10.53 LUFS
# ceilingLufs: how high a max mode searches — no goal, a bound well above any landing a budget allows.
# floorLufs: how low a max master ever lands, whichever target the mode sits on (owner, 04.10: "always pulled up to −14"):
#   a mix so dense the budget holds it under is landed again there, with no budget, and delivered there.
[landing.max]
ceilingLufs = -5
floorLufs = -14
# The drive interval that proves the limiter-budget edge. The master command may override it within 0.05…1 dB.
budgetResolutionDb = 0.25
clean = { budgetDb = 0.5 }
dense = { budgetDb = 1.75 }

# THE LIMITER — always on, with no tick; its setting is the target's ceiling. The ceiling is hard; its gain reduction is
# held by [landing] limiterBudget, and no PLR and no other cost of the master limits how far it goes for the loudness.
# ceilingMarginDb: the limiter is first given a ceiling this much below the promised one; the solver moves it from
#   there.
# releaseMs: the limiter's release — chosen, not yet calibrated by ear.
# dualRelease, slowReleaseMs: the core's second, slower release envelope — off, and its release stated anyway, so the sound
#   depends on no default of the core's.
# lookaheadMs: the limiter's lookahead — topology of the chain, stated for the same reason.
[limiter]
ceilingMarginDb = 0.15
releaseMs = 50
dualRelease = false
slowReleaseMs = 200
lookaheadMs = 1

# THE PEAK CLIPPER INSIDE THE LIMITER, in the limiter's oversampler, its threshold relative to the ceiling. For a person it
# is part of the limiter, not a device: the report has one limiter line (the ceiling and the master's true peak), the
# clipper's statistics go to the detailed log, and the knob "cut needles: auto · manual · off" is the limiter's. It does
# not promise a true peak at its threshold.
# littleNeedDb: when the NEED — how many dB must come from somewhere to reach the target: the input's PLR minus the
#   target's headroom (ceiling minus loudness) — is at most this, the needles are not measured and are left to the
#   limiter. Above it they are measured on the INPUT, with the ceiling at "input peak − need" (analysis::PeakExcursions),
#   and their class sets how much the clipper cuts off the peaks — at most that much, the limiter does the rest: the
#   threshold stands max(0, need − cut) above the ceiling (owner, 30.09) — a forecast; the master's threshold is worked
#   out from the peak the landing's first pass measures at the limiter's input, for the gain and ceiling it settles on,
#   so the clipper takes at most the cut at any gain:
#     short    p90 of the run length ≤ shortP90Ms, bass share of the dose ≤ shortBassShare, PLR ≥ shortPlrDb, the source
#              not clipped: up to shortCutDb off the peaks;
#     long     bass share ≥ longBassShare, or p90 ≥ longP90Ms, or PLR < longPlrDb, or a clipped source: the clipper is
#              switched off by its flag (an unreachable threshold is not "off" — the solver moves the ceiling);
#     between  up to betweenCutDb, with care.
#   clippedPerMinute (owner decision 3.7): a source is CLIPPED — and the machine cuts no needles, a clipper would add
#     distortion to it — when the clip detector confirmed at least this many clips per minute of programme. Fewer are
#     single places (an edit, a joint): the clipper is allowed, and the report names where they are.
#   A person's "manual X" — X dB off the peaks, the threshold max(0, need − X) — sounds over every one of these — the class, a need of littleNeedDb or less, needles that were
#   not measured, a clipped source, a target without a peak clipper — with the machine's reason beside the knob.
#   bassBelowHz: the bass of the dose is the crest bins whose lower edge is below it. densityMinusDb, densityWithinDb: the
#   density near the ceiling (maxima above −densityMinusDb, and within densityWithinDb of it) is printed beside the class
#   and does not decide it. The class bounds are the owner's starting numbers (decision 3.6), as are the two cuts
#   (up to 3 and 1.5 dB off the peaks), the two PLR bounds (10 and 8 dB), "need ≤ 3 dB: do not measure" and the ten clips
#   a minute; bassBelowHz and the density are hypotheses.
# kneeDb: 0 — a hard clip.
# manualMinDb…manualMaxDb, manualStepDb: the manual cut's travel — 0 to 6 dB, the whole domain — and step, 0.1 dB (owner,
#   02.10). The manual cut starts at betweenCutDb, the "between" class, inside manualDomain.
[limiter.peakClipper]
manualDomain = [0, 6]
littleNeedDb = 3
shortP90Ms = 2
shortBassShare = 0.25
shortPlrDb = 10
longP90Ms = 8
longBassShare = 0.5
longPlrDb = 8
clippedPerMinute = 10
shortCutDb = 3
betweenCutDb = 1.5
bassBelowHz = 200
densityMinusDb = 3
densityWithinDb = 0.3
kneeDb = 0
manualMinDb = 0
manualMaxDb = 6
manualStepDb = 0.1

# THE LOW END (analysis::LowEnd), first phase. The file is measured once, for every target at once — the bass width at
# 120 and at 150 Hz, the crossovers of the targets — and a change of target measures nothing again.
# occupiedFromDuty: a band is occupied when it stood within run.dutyThresholdDb of the loudest band of its frame in at
#   least this share of FRAMES — not of time: frames overlap (the hop is half the window), so the quantum is 1/frames
#   (263 frames on a six-minute mix at 48 kHz). A hypothesis: on a test mix 0.02, 0.05 and 0.10 gave the same note, 0.20
#   moved it by two semitones and 0.50 by thirteen — below 0.2 it decides little, above it everything.
# occupiedMarginWhenOnDb (owner decision 3.2): the lowest note must stand at least this far above the duty line, and its
#   band be occupied in at least occupiedFromDuty of the frames (10 %). Without a band that passes, or a valid note, there
#   is no note: the target's floor, never the loudest band in its place, and never a higher band — a note above the true
#   one would cut music.
# lowestNoteFromHz (owner, 06.10: «the spectrum from 10 Hz, the lowest note from 25 Hz — not 20, 25»): the lowest note is
#   sought from the first band whose centre lies at or above it, G#0 at 25.96 Hz. The run measures from 10 Hz for the
#   spectrum, and a band under this one is skipped — it is never the note and never stands in the way of the bands above.
# infraLowCrossoverHz: the infra-low LowEnd run, for the infra-low share (a hypothesis, and also where "below the table"
#   ends). The share is LR4-weighted — content AT the crossover counts a quarter — not "energy below 30 Hz". The main run
#   at 120 Hz cannot answer it: its share is the bass, not the infra-low (0.2274 against 0.0056 on the same mix). The
#   price is an additional LowEnd pass alongside the 120 and 150 Hz readings: 0.28 s per minute of programme at 48 kHz, measured.
[lowEnd]
occupiedFromDuty = 0.10
occupiedMarginWhenOnDb = 2
lowestNoteFromHz = 25
infraLowCrossoverHz = 30

# THE GEOMETRY OF THE MAIN RUN — the core's LowEnd defaults written out as numbers, so that nothing depends on a default
# that may move. With these the table is 59 semitone bands, MIDI 4…62 (10.30…293.66 Hz): from 10 Hz since 06.10 (owner: the
# rubbish under 20 Hz is of interest), the lowest note from [lowEnd] lowestNoteFromHz. fftOrder 17: a 2.73 s window and a
# 1.365 s hop at 48 kHz (18 would take 12.6 MB instead of 7.1 on 48 kHz stereo); its bands are four bins wide — a Hann
# main lobe — from 25.36 Hz at 48 kHz (23.30 at 44.1, 50.71 at 96), and the bands under that are published as unresolved. skipBlocks 0 is a named
# impossibility rather than a choice: the settling count the core derives from the filter is not on its interface, and
# skipBlocks moves only the histogram, which is not read. The schema hands this block — and the infra-low run, the same
# geometry split at infraLowCrossoverHz — to LowEnd::storageFor at every source rate the product accepts (8, 44.1, 48 and
# 96 kHz): the analyzer says what it admits, and the block is refused whole where it refuses.
[lowEnd.run]
crossoverHz = 120
lowNoteHz = 10
highNoteHz = 300
fftOrder = 17
dutyThresholdDb = 20
skipBlocks = 0

# THE HIGH-PASS — the machine's (owner decisions 3.2–3.4: always placed, the floor, the 50 Hz top, the slopes, the comfort
# window). It stands on every target and every input, a quiet one included; there is no "nothing below the note" any more
# (owner decision 3.3: a mix made outside a studio always has mud down there, and cutting below 32 Hz too much is better
# than too little).
# The cutoff is max(the cutoff the lowest note allows, the target's floor), never above machineTopHz: the note allows the
# cutoff at which the high-pass the chain runs — the core's matched Butterworth cascade of the target's slope, at the
# source's rate — takes exactly the target's noteLossDb at the note. It is found on that response, not on the analogue formula, and
# it is not rounded to the hertz (technical decision 3О4). A floor above it takes more of the note, and the report says
# how much; "the cutoff hit 50 Hz: the lowest note is higher" when machineTopHz stops it.
# note (owner decision 3.2): the lowest note — the lowest band on at all from [lowEnd] lowestNoteFromHz up — is sure when its
#   band is occupied ([lowEnd] occupiedFromDuty, 10 %), stands
#   [lowEnd] occupiedMarginWhenOnDb (2 dB) above the duty line, lies above aboveHz (not DC, not rumble) and sounds at least
#   soundingAtLeastS in all — its frames times the analyzer's hop. A programme shorter than [input] shortSeconds is not
#   searched. A note that is not sure gives the floor.
# band: the core's EQ band the high-pass writes.
# hzMin…hzMax: slider travel — to 80 Hz for a person (owner, 01.10: a voice with a guitar from a microphone takes a cut
#   that high); frequencyDomain checks the actual source Nyquist limit.
# machineTopHz: the machine's top — the machine's cutoff never goes above it, whatever the note; at most hzMax.
# slopes: slider choices, ascending; slopeDomain and slopeMultiple accept every filter order 1–16 — 18 and 36 included, as
#   written, never read as the nearest choice. slopesNormal: not a warning (48 warns of ringing); slopeDefault: the manual
#   default, named as a number so that the order of the list cannot change the sound.
# comfort: the knob's field is neutral from lowHz to highHz and shades through a warning towards warningLowHz below and
#   warningHighHz above, red past them (50 to 80 Hz of the travel is red) — one window, a hint to the knob, changing
#   neither the machine nor the travel. Below 27 Hz the field yellows (owner, 06.10), red from 23 — the ramp as long as
#   before; above 42 Hz the cutoff takes music, not rubbish (at 50 Hz and 24 dB/oct, 8.4 dB at 40 Hz).
# curveTopDb, curveBottomDb, curveStepDb, curveHeadroomDb: the scale of the high-pass curve, dB — a filter's slope goes
#   down by definition, so it is not judged by the ±2 dB of the other curves.
# marks: labels on the frequency axis of the curve, where the low end of instruments lives; behind the curve the spectrum
#   of THIS mix is drawn. What a cutoff costs there: at 32 Hz and 24 dB/oct, 0.5 dB at 41.2 Hz (E1), 3.7 dB at 30.87 Hz
#   (B0), 6.4 dB at 27.5 Hz (A0, the piano's lowest key). The guitar's low E (E2, 82.41 Hz) and speech (70 Hz) stand
#   above the machine's 50 Hz top: where a person's knob would start taking a voice with a guitar (owner, 06.10, which
#   also took the 808's mark out).
[hpf]
frequencyDomain = "sourceNyquist"
slopeDomain = [6, 96]
slopeMultiple = 6
hzStep = 1
band = 0
hzMin = 15
hzMax = 80
machineTopHz = 50
slopes = [12, 24, 48]
slopesNormal = [12, 24]
slopeDefault = 24
note = { aboveHz = 20, soundingAtLeastS = 3 }
comfort = { lowHz = 30, highHz = 42, warningLowHz = 26, warningHighHz = 50 }
curveTopDb = 0
curveBottomDb = -36
curveStepDb = 6
curveHeadroomDb = 3
marks = [
    { key = "kick", hz = 50 },
    { key = "bass4", hz = 41.2 },
    { key = "bass5", hz = 30.87 },
    { key = "piano", hz = 27.5 },
    { key = "guitar", hz = 82.41 },
    { key = "speech", hz = 70 },
]

# MONO BASS (owner decisions 3.5) — always placed, at the target's crossover (targets.toml): it is there for subwoofers and
# mono speakers, not for loudness. Wide bass does not switch it off; it is a warning ([observations] wideBass). What it
# decides by is the harm itself: how much of the low end folding to mono, (L+R)/2, takes away below the crossover, where
# the bass sounds — the loss of the side's share, 10·log10((mid + side) / mid) of the energies under the crossover's LR4,
# over the 10 ms blocks of the first phase's low-end run at that crossover (120 Hz, 150 Hz on vinyl). Under warnFromDb it is
# placed; from warnFromDb to offAboveDb, both included, it is placed with the number ("the bass is partly in opposite
# polarity: mono bass takes N dB of the low end"); above offAboveDb the machine leaves it out ("… check the polarity of a
# channel"), and a person who switches it on anyway is obeyed and warned beside the tick and in the report. Opposite
# polarity above the crossover does not count: only the low band is read. A mono input has no side and no mono bass.
# loss.soundingWithinDb, loss.soundingAtLeastS (hypotheses): the bass sounds in a block whose low-band level is within
#   soundingWithinDb of the programme's loud bass — the level 5 % of the sounding blocks reach — and the reading holds
#   when it sounds at least soundingAtLeastS in all. Less than that, or a low end that could not be measured, is its own
#   reason, and the machine leaves mono bass out: it does not fold what it could not weigh.
# lowWidth: the width below the crossover — 0, full mono; lowWidthRange, lowWidthStep: its knob's travel and step.
# frequencyRange, frequencyStep: the crossover knob's travel and step — 5 Hz (owner, 02.10).
[monoBass]
frequencyDomain = [60, 300]
lowWidthDomain = [0, 1]
lowWidth = 0
lowWidthRange = [0, 1]
lowWidthStep = 0.05
frequencyRange = [60, 300]
frequencyStep = 5
loss = { warnFromDb = 1, offAboveDb = 3, soundingWithinDb = 20, soundingAtLeastS = 3 }

# The knob's scale shows two regions, each with a physical reason rather than a taste; the map is static — it follows
# neither the target nor anything else — so a person learns it once. club 80…120: a venue sums its subwoofers to mono
# around here, and whatever lies below the room folds itself; above 120 a club master gives up to mono what the tops
# would keep stereo. vinyl 120…200: cutters ask for mono below 120…300 and set their elliptical filter at 100…150 (the
# lp target takes 150); above 200 the narrowing is heard. Red is what no destination asks for: 60…80 and 200…300.
[monoBass.zones]
club = { fromHz = 80, toHz = 120 }
vinyl = { fromHz = 120, toHz = 200 }

# THE COMPRESSOR — the chain stage the glue drives ([glue]).
# detector: rms, where the core's default is peak — every threshold offset of the glue is calibrated for RMS detection
#   (with RMS a positive offset cuts almost nothing); peak with the same numbers would be another glue.
# rmsWindowMs, link, mode, rangeDb, makeupDb, autoMakeup: every field named, the neutral ones too, so the sound
#   depends on no default of the core's.
# lookaheadMs, sidechainHpfHz: the stage's lookahead and its key filter (0: self-keyed) — topology of the chain, stated
#   for the same reason.
# thresholdFrom (an owner decision): the threshold is counted from the programme's short-term P95 — the level the song
#   is above 5 % of the time, already in the programme report — not from its single loudest second, which one loud joint
#   moves. Both are read in the input's normalised system: the P95 plus the one gain that brings the input to [input]
#   referenceLufs, so the same mix exported louder or quieter gets the same compressor.
[compressor]
detector = "rms"
rmsWindowMs = 5
link = "max"
mode = "downCompress"
rangeDb = 60
makeupDb = 0
autoMakeup = false
lookaheadMs = 1
sidechainHpfHz = 0
thresholdFrom = "shortTermP95"

# The clamps on every compressor value but the ratio: threshOffset, knee dB; attack, release ms. Only the release bites in
# practice, since it follows the measured tempo: at g = 1 the glue gives 63 ms at 120 BPM and 54 at 140, and the clamp
# starts at about 150 BPM (a knob of 6 dB: 60 ms at 120, the clamp from 144). A clamp that ate a person's choice is announced on the device, never silently. release.min 50 ms is one
# and a half periods of 30 Hz; a floor derived from the high-pass cutoff (2000 / cutoff) was rejected — at a 15 Hz cutoff
# it gives 133 ms and clamps hardest exactly where a fast release is needed.
[compressor.limits]
threshOffset = { min = -15, max = 10 }
attack = { min = 5, max = 50 }
release = { min = 50, max = 500 }
knee = { min = 1, max = 8 }

# THE TEMPO IS MEASURED, NOT ASKED (felitronics::tempo). The release follows it only when its confidence label is
# trustedConfidence (high: a confidence of at least 0.5); a medium or lower label is a guess, and a guess is heard in the
# release. Otherwise bpmWhenUnsure.
[compressor.tempo]
bpmWhenUnsure = 120
trustedConfidence = "high"

# THE GLUE — one continuous knob for the whole compressor, "up to N dB" (owner decisions 3.8, 3.8а): what a person turns,
# what a project holds and what every glue number below is written in. N IS THE LOSS ON THE LOUD PLACES: the static curve
# takes exactly N dB at the short-term P95 of the input brought to [input] referenceLufs — not a ceiling on the live
# reduction; what the compressor really did (its P95 and its maximum) is measured after the master and reported. The
# machine sets it only on the targets in byTarget (cd alone), never above knobMaxDb; everywhere else it is a taste of the
# manual mode. 0, the left end, takes the compressor out of the chain — not "a compressor at zero". The glue does not enter
# the loudness path: with a 12…30 ms attack it lowers loudness, not peaks. Without a P95 the glue is unavailable to the
# machine and to a person alike, with its reason — no P95 is invented, the person's value is kept, and a master is made
# without it.
# domain: what a command and a project accept, 0…6 dB. knobMinDb…knobMaxDb, knobStepDb: the slider's travel and step —
#   hints (an owner decision: the slider runs 0…3); a value between steps or past the travel is taken as written.
# default: the glue a target without an entry in byTarget starts with, dB on the knob.
# whenTicked: what the knob takes when a person ticks the glue on without touching the knob, dB.
# byTarget: the machine's glue per target, dB on the knob (an owner decision: cd alone, 2.6).
# THE TRAVEL — ONE SMOOTH FORMULA for the whole domain, no steps and no rounding. Every compressor value moves along a
# travel g by its law, from `from` at g = 0 towards `to` at g = 1 and on by the same law past it:
#   byDepth    even steps of (1 − 1/ratio), the share of the overshoot the compressor removes; the ratio's law alone;
#   linear     even steps of the number itself;
#   geometric  even steps of the ratio between neighbours — time is heard logarithmically.
# The threshold stands threshOffset(g) dB from the loud places — the P95 plus detectorOverP95Db, below — (under them: they
# overshoot it by −threshOffset), so the static curve — the core's own, soft knee included — takes
# kneeOver(−threshOffset(g); knee(g)) · (1 − 1/ratio(g)) dB there.
# That loss grows with g without a break, and THE KNOB'S N IS THE g AT WHICH IT EQUALS N: N = 2.6 stands at g = 0.677
# (ratio 1.74, threshold 6.1 dB under the loud places, attack 17.8 ms, knee 5.3 dB), N = 3 at g = 0.728, N = 6 at g = 1.029 — just
# past the old right end (2.7 and −9, "where the old version reached with two knobs together"), by the same laws. The
# compressor stays soft: above 3 it is only denser. divisor divides the beat: release = 60000 / bpm / divisor(g), kept
# within [compressor.limits] release — 250 ms at g = 0 and 63 ms at g = 1 at 120 BPM.
# detectorOverP95Db — THE CALIBRATION of the scale to music (architecture В11). The P95 is a short-term LOUDNESS, in
#   LUFS; the compressor's detector is a 5 ms RMS in dBFS with an attack, and what it takes on the loud places is not the
#   static curve read at that number. The threshold therefore stands detectorOverP95Db above P95 + threshOffset(g): one
#   offset, chosen so that the knob IS the gain reduction really taken on the loud places — its P95 over the programme,
#   the median of the owner's 11 mixes. Measured (2026-09-30): the median equals the knob at an offset of 1.57 dB for
#   1.25, 1.52 for 2.6 and 1.54 for 3 (1.86 for 0.5, 1.74 for 6); with 1.5 the median is 1.27, 2.61 and 3.02 dB, the
#   single mixes 1.02…1.55, 2.19…3.04 and 2.56…3.48 (at 0 it was 1.68, 3.24 and 3.70). The report states what each
#   master's compressor really took.
[glue]
domain = [0, 6]
default = 0
whenTicked = 0.5
byTarget = { cd = 2.6 }
detectorOverP95Db = 1.5
ratio = { from = 1.0, to = 2.7, law = "byDepth" }
threshOffset = { from = 0, to = -9, law = "linear" }
attack = { from = 30, to = 12, law = "linear" }
knee = { from = 8, to = 4, law = "linear" }
divisor = { from = 2, to = 8, law = "geometric" }
knobMinDb = 0
knobMaxDb = 3
knobStepDb = 0.1
# THE GLUE IN PARALLEL (owner decision, 05.10, v0.17.0: «делай ручку 40% по дефолту»): the compressed signal's share of the
# glue's output — the rest the dry signal (the chain's compressorMix), 1 the downward glue as it always was. mix: what the
# machine's layer takes, the auto plan and a manual glue alike; the overnight study (parallel variants at the same share)
# had 0.4 beat the downward glue — better PEAQ, low-end punch, LRA and noise floor — and the owner listened.
# mixDomain, mixRange, mixStep: the knob, a share 0…1 (the page prints it as a percent) by 0.2 — 0, 20, 40, 60, 80, 100 %
#   (owner: a finer step is placebo).
mixDomain = [0, 1]
mix = 0.4
mixRange = [0, 1]
mixStep = 0.2

# SATURATION — the peak-normalised saturator, the chain's clipper stage. A taste of the manual mode: the machine never
# sets it, and it does not shorten needles (the peak clipper inside the limiter does).
# shape: tape (owner, 01.10; tanh before).
# THE DRIVE KNOB IS A DISTANCE FROM THE PROGRAMME'S PEAK, not absolute decibels: the knob is the drive the programme would
#   get normalised to 0 dBTP, so one number gives one result on a quiet and a loud copy of one file (between different
#   files it aligns only the peak — how much reaches the bend is each music's own). The conversion is not arithmetic: the
#   core drives the shaper at k = 10^(drive/20) − 1, so what is aligned is the SHAPER'S GAIN,
#   driveDb = 20·log10(1 + (10^(knob/20) − 1)·10^(−peak/20)). Measured on clipper + limiter (a synthetic mix at −12 and
#   +6 dB, knob 3, the worst sample): absolute drive 2.94e−2 apart, "knob minus peak" 6.12e−2, the shaper's gain 2.12e−3.
#   At knob 0 the drive is 0 whatever the peak; without a measured true peak a non-zero knob is not offered.
# driveRange 0…12 dB: above twelve tanh squares music rather than densifying it; driveStep 0.5 dB: less is not heard, more
#   is a jerk. mix 0…1. No output knob: the landing sets the level before the limiter, so a trim would be undone.
# autoComp 0 is written over the core's default 0.5: the output is then tanh(k·s)/tanh(k), normalised to its own k.
# shape: the machine's type, one of the core's eight (tanh, atan, cubic, asym, tube, transistor, transformer, tape); the
#   machine never picks another. A person picks the type by hand among tanh, tube, transistor, transformer and tape;
#   atan, cubic and asym stay here, for research. tape is the default (owner, 01.10): the machine never raises the drive,
#   so the type is heard once a person does.
# bias and dcBlockHz are read by the core for the asym shape only. Below a drive of 0.00087 dB (the core's number) every
# value is one setting.
# cut (owner decision 3.9): what the stage took off the peaks is measured ON THE STAGE — the peak of its input against the
#   peak of its output, quantum by quantum, after its mix — never the fall of the whole chain's true
#   peak (that is the limiter's and the peak clipper's work). A peak-normalised shaper lifts everything under full scale,
#   so the ratio alone is a gain: a peak was cut by how much less it got than a sound too quiet to bend gets (the mix is
#   in both). The report gives the largest cut and the usual one over the
#   loud places — the loudShare of the quanta with the highest input peaks: their largest, and their median.
[saturation]
driveDomain = [0, 12]
mixDomain = [0, 1]
shape = "tape"
driveDb = 0
driveRange = [0, 12]
driveStep = 0.5
bias = 0
mix = 1
mixRange = [0, 1]
mixStep = 0.05
autoComp = 0
dcBlockHz = 0
cut = { loudShare = 0.05 }

# TILT — a manual device with one knob, in dB, and its tick: the machine does not touch timbre (a tilt taken from a
# measurement is a genre trap) — it leaves the tick off and the knob at 0. The geometry (technical decision 3О10): the
# core's tilt about the pivot — a low shelf of −dB and a high shelf of +dB there, so the low end goes down by the knob,
# the top up by it, the ends 2·dB apart and the pivot unmoved. The pivot itself, like every filter of tilt, low and the
# bands (type, hz, q), is felitronics-bands' bands.toml, keyed tilt, low, body, mud, forward, brightness, air — never
# written here (the config's schema refuses it). domain: what a command and a project accept (±6 dB);
# band: the core's EQ band it writes; normal: where the value turns red; hard: the ends of the slider's travel; step: the
# knob's step — travel and step are hints, a value between steps or past the travel is taken as written.
[tilt]
domain = [-6, 6]
band = 1
normal = [-1.5, 1.5]
hard = [-3, 3]
step = 0.1

# LOW — a separate device on every target, with one dB knob and an on tick. The machine enables it only
# when the target carries lowDb, its correction for the medium (today lp, +0.5 dB) — and not on an input too quiet to
# measure ([input] quiet), where it places no device; otherwise off at 0 dB. Hand edits apply whether the panel is
# visible or hidden. A STATIC shelf (technical decision 3О10): no dynamics, no trial render, nothing taken from a
# measurement.
# band: the core's EQ band; domain, normal, hard, step: as for tilt; the shelf's corner and Q: bands.toml.
[low]
domain = [-6, 6]
band = 2
normal = [-1.5, 1.5]
hard = [-3, 3]
step = 0.1

# THE EQ BANDS — one device of five static bands, a person's only (the owner's decision of 01.10): the machine leaves
# every band at 0 dB, since it does not touch timbre in this release. A band at 0 dB is neutral and out of the stage, and a
# revert gives the machine's 0 back. The device's tick (on, field 5) takes all five in or out with the gains kept: the
# machine's is always on, a person may untick it. No dynamics yet, and no advice beyond a norm.
# Per band: band, the core's EQ band (the filter — a bell or a high shelf, its centre or corner and Q — is bands.toml's);
# domain, the gain a command accepts; normal, where the value turns red, within the travel — ±1.5 dB as tilt and low
# (owner, 02.10; the mud band, a cut alone, down to −1.5); hard, the knob's travel; step, its grid.
[bands.body]
band = 3
domain = [-6, 6]
normal = [-1.5, 1.5]
hard = [-3, 3]
step = 0.1

[bands.mud]
band = 4
domain = [-6, 0]
normal = [-1.5, 0.0]
hard = [-3, 0]
step = 0.1

[bands.forward]
band = 5
domain = [-6, 6]
normal = [-1.5, 1.5]
hard = [-3, 3]
step = 0.1

[bands.brightness]
band = 6
domain = [-6, 6]
normal = [-1.5, 1.5]
hard = [-3, 3]
step = 0.1

[bands.air]
band = 7
domain = [-6, 6]
normal = [-1.5, 1.5]
hard = [-3, 3]
step = 0.1

# THE EQ STAGE — one stage of the core that several devices write (the high-pass, tilt, low, the bands): a device is not a
# stage. curve: where the summed curve the core computes leaves ±warnDb it is filled red and labelled; scaleDb is the
# curve's scale and fieldDb its field. Snapshot eqCurve carries the summed response in Hz/dB for the page.
[eq]
curve = { warnDb = 2, scaleDb = 3, fieldDb = 4 }

# THE CHAIN'S FIXED GEOMETRY — what no device decides and every master shares, stated so the sound depends on no default
# of the core's: the internal quantum every stage is called with (the chain's output is the same whatever block a caller
# feeds it), and the oversampling the saturation and the limiter — with the peak clipper inside it — work at. WHICH
# stages a master's chain has is not here: it follows the devices as they sound (below).
[chain]
internalBlock = 256
oversampleFactor = 4
tapsPerPhase = 64

# THE DEFAULTS LAYER OF THE TICKS — what a project file is written against (it states a machine value only where it
# differs from these) and what stands before anything is measured. It is NOT the chain's topology: what sounds is the
# effective tick — a person's, else the machine's — and the planner decides every tick it has a rule for whatever stands
# here: the high-pass always; mono bass by the loss it weighs (monoBass = false is only "not yet weighed"); the glue by
# [glue] byTarget, and a glue of 0 keeps the compressor out whatever its tick. clipper is the saturator's stage; the peak
# clipper is inside the limiter. The limiter is always on, and the schema refuses false.
[stages]
eq = true
monoBass = false
compressor = true
clipper = false
limiter = true
dither = true

# DITHER — only where the delivery cuts the bit depth, at up to onUpToBits: a 24-bit delivery has its quantisation noise
# near −144 dBFS already and gets none. shaping: the noise shaping at up to shapingUpToBits, which hides the 16-bit floor
# where the ear is least sensitive. There is no dither stage above that at all — shaped noise at 24 bits would go to
# 15…20 kHz, which RIAA raises by 19.6 dB on vinyl and which heats the cutting head. A person may switch it off at 16
# bits (the delivery is then rounded to its grid without noise); above onUpToBits a person's tick is kept and does
# nothing, with its reason.
# THE NOISE ITSELF IS A VERSION OF THE SOUND (technical decision 3О11): weighted TPDF from a fixed seed — sixteen
# hexadecimal digits, a number no TOML integer holds — silenced after autoBlankSamples consecutive zero samples of a
# channel (autoBlank), so one master is the same bytes every time it is made and digital silence stays silence. The
# delivery is quantised once, in the chain; writing the file adds no noise again.
[dither]
onUpToBits = 16
shaping = "weighted"
shapingUpToBits = 16
seed = "853c49e6748fea9b"
autoBlank = true
autoBlankSamples = 4096

# DELIVERY OF A SOURCE THAT IS ALREADY MASTERED (owner, 05.10): a normalising or quieter non-spec target keeps the
# source loudness. Above −14 LUFS its peaks get 2 dB of codec headroom; otherwise 1 dB. The recognition thresholds are
# independent under [observations.alreadyMastered].
[masteredDelivery]
loudAboveLufs = -14
loudCeilingDbTp = -2
regularCeilingDbTp = -1

# THE DE-ESSER — manual, off, depth −6 dB (an owner decision, after six blind pairs at matched loudness: five of six told
# apart, none harmed, hats included). offered = false: no shell offers it. Its automatic mode is off until it is
# calibrated by ear. The sibilance observation is published all the same (owner decision 3.13: shown before any de-esser).
# band: the core's free EQ band (0 the high-pass, 1 tilt, 2 the low shelf). Its centre starts at the geometric mean of the
#   burst band ([stereoBursts], ≈ 6708 Hz); q 1.5 covers the sibilance band (a hypothesis). atk, rel: deviations from the
#   ballistics the core derives from the band's frequency and Q, 0…1 with 0.5 automatic — not milliseconds.
# THE AUTOMATIC DEPTH (off): the bursts' p90 excess over offsetDb, times ratioSlope (1 − 1/4, the core's ratio 4), rounded to
#   the decibel and held within minDepthDb…maxDepthDb; placed only at a confidence above confidenceAbove, and held back
#   when the loudness moves outside minDeltaLufs…maxDeltaLufs. All hypotheses.
# centreHz, widthOct, depthDb with their steps: the manual knobs (hypotheses). A width converts to Q as
#   sqrt(2^oct) / (2^oct − 1).
# witnessQuantiles: after a master, the paired change of the bursts' excess, input against output, is reported at these
#   quantiles — the median and p90 — as measured; no line is drawn on it.
[deEsser]
offered = false
automatic = false
manualDepthDb = -6
band = 8
q = 1.5
atk = 0.5
rel = 0.5
offsetDb = 6
ratioSlope = 0.75
minDepthDb = 2
maxDepthDb = 6
confidenceAbove = 0.5
minDeltaLufs = -0.25
maxDeltaLufs = 0
centreStepHz = 100
widthStepOct = 0.1
depthStepDb = 0.5
centreHz = [3000, 12000]
widthOct = [0.5, 2.0]
depthDb = [-10, 0]
witnessQuantiles = [0.5, 0.9]

# BURSTS IN THE SIBILANCE BAND, on mid and side (analysis::StereoBandBursts), second phase: a short rise over the band's own
# baseline. The band, the hop, the baseline and the enter and exit levels are the starting settings (hypotheses);
# eventCapacity is the core's published default for stored events per axis — completeness is the core's to report, and a
# lost tail never reads as zero events. StereoBandBursts::storageFor admits the block, or the schema refuses it whole, at
# 44.1, 48 and 96 kHz — a source under about 18.4 kHz has no room for a 9 kHz corner, and there the bursts go unmeasured.
[stereoBursts]
bandLowHz = 5000
bandHighHz = 9000
hopMs = 10
baselineMs = 2000
enterDb = 6
exitDb = 3
eventCapacity = 16384

# OBSERVATIONS — when a measurement becomes a finding. A measurement is a number; a finding is a number we are ready to say
# out loud what it means. A finding has two weights in 0…1: CONFIDENCE (how firmly it is measured) and SEVERITY (how much
# it matters for the master), each rising from `from` (where we start to speak; 0 where it is not written) to 1 at
# `fullAt`. The one exception is the spectral wall's confidence, whose `from` is the core's own. None of these numbers is
# the core's: the core measures, the line "this is a problem" is ours.
# doubtfulBelow: a finding less confident than this is doubtful — still shown, behind a button and on a tier of its own.
# clipping: full weight when a thousandth of the programme is clipped (14 000 samples on a five-minute mix). The source's
#   clipping is not something a device cures; a new mix does.
# dcOffset: 0.001 is −60 dBFS, below which an offset eats no headroom; 0.01 is −40 dBFS and eats 1 % of the travel. Its
#   style by size (owner decision 01.10): under warningFrom (1 % of full scale) a note — the master's high-pass removes it,
#   but the mix chain is worth a look; from warningFrom a warning; from errorFrom (10 %) an error.
# bitsUnused (owner decision 01.10): judged by the EFFECTIVE depth — the container's bits less the low bits that are
#   always zero ("24 bits carrying 16" is a depth of 16). A depth of depthBits (24) or more is nothing; from fromBitsShort
#   bits short of it (23 bits) a warning — somewhere in the mix chain the audio was truncated; from errorFromBitsShort
#   (8 short: 16 bits and less) an error — a 16-bit mix, to be mixed down again at 24. The severity rises from
#   fromBitsShort to full at fullAtBitsShort. A float file off the PCM grid has no depth: not applicable.
# edgeSilence: half a second is heard at a playlist's joint; ten is a forgotten tail.
# hum: a finding needs a live line and 10 dB, the core's own minProminenceDb below which it publishes no line. Its
#   severity is the line's power against the programme's mean power (the numerator over the quiet parts, the denominator
#   over all of it), in dB: 0 at fromPowerDb (−60 dB), full at fullAtPowerDb (−40 dB), straight in dB between (owner
#   decision 01.10: 2 dB a tenth). A sine of amplitude A carries A²/2, so a −60 dBFS line under a −14 dBFS RMS programme
#   is −49 dB. A note — a warning from warningFromSeverity (0.5, −50 dB) when the line is confident, not doubtful.
# humWandered: a wandering line is never more confident than this — half of doubtfulBelow, so it always reads doubtful.
# spectralWall: confidence by the depth of the drop, from the core's minDropDb to full at fullAtDropDb (40 dB, owner
#   decision 01.10); severity by how far below Nyquist, from fromFractionBelowNyquist (0.12: a wall at 88 % of Nyquist or
#   lower — 19.4 kHz at 44.1 kHz), since the core calls a wall "at Nyquist" from 80 % up. 128 kbit/s walls at 16 kHz sit
#   0.27…0.33 below Nyquist; full severity at 0.5 is 96…112 kbit/s. A warning: the source went through mp3 or AAC.
# infraLow: the infra-low finding's weight, from a share of `low` to `high` (hypotheses; the reference mixes top out at
#   1.632 %, so they cannot calibrate it). Its style by size (owner decision 01.10): a note from `low` (2 %) — the master's
#   high-pass removes it; a warning from warningFrom (5 %) — the high-pass cuts a part large enough to move the mix's
#   loudness and balance.
# wideBass (an owner decision): side at or above this share of the energy below the main measurement's crossover
#   ([lowEnd.run], 120 Hz) is wide bass — a WARNING of the first phase, before the master: mono bass will gather it and
#   headphones will hear it narrower, and whoever needs the width switches mono bass off. The one threshold, with no
#   knob: a person has the tick. Below it there is no line of its own; the mono-bass report says how much side it
#   gathered. Its severity rises from that share (6 %) to full at fullAt (30 %, owner decision 01.10).
# polarity: bass in opposite polarity when the stereo correlation is below correlationBelow or the raw side share is above
#   rawSideFractionAbove. Its severity (owner decision 01.10) by the LOW band's correlation, (M² − S²) / (M² + S²) =
#   1 − 2 × the side share below the crossover: 0 at 0, full at fullAtLowCorrelation (−0.5) and below.
# alreadyLimited: the programme is limited already when its PLR is below plrBelowDb (10.5 dB, owner decision 01.10; a
#   hypothesis), or when it is clipped. Its severity rises as the PLR falls, from plrBelowDb to full at fullAtPlrDb (7 dB).
# tooShort: a programme shorter than [input] shortSeconds is a sketch — said once, as a finding.
# vinylTop (owner decision 3.12): on a target cut to vinyl the report always carries one note, with no threshold and no
#   measurement behind it — above aboveHz the cutting engineer usually rolls the top off; keep it in mind.
[observations]
doubtfulBelow = 0.5
clipping = { fullAtShareOfProgramme = 0.001 }
dcOffset = { from = 0.001, fullAt = 0.01, warningFrom = 0.01, errorFrom = 0.1 }
bitsUnused = { depthBits = 24, fromBitsShort = 1, fullAtBitsShort = 8, errorFromBitsShort = 8 }
edgeSilence = { fromSeconds = 0.5, fullAtSeconds = 10 }
hum = { fromProminenceDb = 10, fullAtProminenceDb = 40, fromPowerDb = -60, fullAtPowerDb = -40, warningFromSeverity = 0.5 }
humWandered = { confidenceCeiling = 0.25 }
spectralWall = { fullAtDropDb = 40, fromFractionBelowNyquist = 0.12, fullAtFractionBelowNyquist = 0.5 }
infraLow = { low = 0.02, high = 0.05, warningFrom = 0.05 }
wideBass = { sideFractionAtLeast = 0.06, fullAt = 0.3 }
polarity = { correlationBelow = 0, rawSideFractionAbove = 0.5, fullAtLowCorrelation = -0.5 }
alreadyLimited = { plrBelowDb = 10.5, fullAtPlrDb = 7 }
# Already mastered (owner, 05.10, v1's 20.6k uploads): ALL three strict tests. Loud mixes around −15…−13 LUFS must
# still be mastered normally; loudness alone is no verdict. These thresholds report a finding, not a device setting.
alreadyMastered = { aboveLufs = -12, peakAboveDbTp = -1.5, plrBelowDb = 11 }
vinylTop = { aboveHz = 16000 }

# The kind of a finding is its nature (owner decision 01.10, row by row): clipping and bass in opposite polarity are errors
# — a defect a master cannot cure; lost bits, a too-quiet export, a dual-mono file, an already limited mix, a lossy source
# and wide bass need attention; the rest describe the file — and the loudest bass note and the lowest band are readings,
# numbers the file shows rather than findings (they do not tint the Low end block). Where the owner approved it, the style
# also follows the SIZE: a DC offset (a note, a warning from 1 %, an error from 10 % of full scale), the effective depth (a
# warning, an error at 16 bits and less), the infra-low share (a note, a warning from 5 %) and the hum (a note, a warning
# from half its severity when confident) — the thresholds are their own tables' warningFrom / errorFrom keys above, and
# this table is the style a finding starts from. A size only raises a style, never lowers it, and never raises a doubtful
# finding. The kind styles a finding and decides nothing.
[observations.kinds]
clipping = "error"
dcOffset = "note"
bitsUnused = "warning"
dualMono = "warning"
edgeSilence = "note"
hum = "note"
humWandered = "note"
spectralWall = "warning"
loudestLowNote = "reading"
sibilance = "note"
lowestLowBand = "reading"
infraLow = "note"
wideBass = "warning"
polarity = "error"
alreadyLimited = "warning"
tooQuiet = "warning"
tooShort = "note"

[observations.sibilance]
minHops = 5
maxHops = 15
fromShareOverDomeDb = -2
fullAtShareOverDomeDb = -0.5
sideBelowMidDb = 6
nearMonoShare = 0.98
fromPerMinute = 10
fullAtPerMinute = 30
periodicToleranceHops = 1
periodicMultiples = [1, 2, 3]
periodicFrom = 0.35
periodicFullAt = 0.8
blindAtDuty = 0.45
severityFromDb = 10
severityFullAtDb = 20
excessQuantile = 0.9
shareQuantile = 0.9
sideMidQuantile = 0.5
loudestMoments = 3

# CREST PER BAND (analysis::BandCrest) — the micro half of what a master cost. The programme is cut into four bands (below
# 120 Hz, 120…2000, 2000…6000, above 6000 — the edges other tools use, so the numbers compare) plus the full band, with the
# peak and the mean square of every block; the loss is the master's peak-to-RMS against the source's, computed by the core,
# and the worst of the four bands is reported as a CVaR95.
# THE MASK: a block counts only where its band had something to lose, and the threshold follows the programme —
#   max(floorDb, the programme's mean square − belowMeanSquareDb) — since an absolute one is not invariant to the input
#   level: measured, the same blocks at 0, −6 and −12 dB of input (39/39/39) against 57/57/43 with the mask nailed to −70.
#   The guarantee ends where the derived threshold meets floorDb, with the programme's mean square below −28 dBFS.
# floorDb is also the fixed gate of that mean square, never the threshold derived from it (which would depend on itself).
# noProgrammeDb: the core's answer on digital silence — "no programme", not "a very quiet one".
# bandShareFloorDb: the floor of a band's share. hopMs, blockHops: 100 ms hops, four to a block — whole 10 ms sub-hops,
# which the schema holds; the rest of the block BandCrest::storageFor admits, or the schema refuses it whole, at 8, 44.1,
# 48 and 96 kHz.
[crest]
bandEdgesHz = [120, 2000, 6000]
hopMs = 100
blockHops = 4
bandShareFloorDb = -40
floorDb = -70
belowMeanSquareDb = 42
noProgrammeDb = -200

# WHAT A MASTER COST, measured after the master and printed as measured, without a verdict: the form of the song (macro,
# [cost.sections]), the crest per band (micro, [crest]), the limiter's gain reduction and pumping, and the loudness range.
# Nothing here changes the target or refuses a delivery; there is no price before the master (owner decisions).
# THE ACTIVE WINDOWS: a window is active when the input's momentary level is at or above the programme's loudness minus
#   activityBelowIntegratedLu, never below activityFloorLufs (the BS.1770 absolute gate). Relative, because an absolute
#   threshold counted different amounts of one file at −12 / 0 / +12 dB (59420 / 62382 / 64775 windows); 42 LU is a
#   hypothesis. With no measured loudness the floor is used.
# limiterActiveInputDb: the silence gate of the limiter's active statistics, which the core computes on the limiter's
#   INPUT, in dBFS. Absolute and not level-invariant by itself — it holds only by standing low: never raise it towards
#   the ceiling (at −10 it decides which file is measured at all), and calibrate nothing on how many windows it passes.
# THE LOUDNESS RANGE ON THE SOURCE'S BLOCKS: the primary range loss is counted on the blocks that passed the SOURCE's
#   gates, the free difference of the two reports beside it (three blocks of 374 flipped its sign otherwise). It is "the
#   range on the source's blocks", not LRA. firstBlockSeconds, blockSeconds, histogramStepDb, absoluteGateLufs and
#   relativeGateLu are EBU Tech 3342 / BS.1770-4's, on a short-term series at 10 Hz that shares the core's grid; the last
#   partial hop is not a block.
# tooQuietBelowLufs: below this on either side the cost is not measured — the report's percentiles are gated absolutely,
#   so on a programme under −70 LUFS a pure gain moves the range (measured: +6 dB at −59.4 LUFS gave −7 LU).
# THE LIMITER'S GAIN REDUCTION: its quantiles over grWindowSeconds windows, the core's; the trace's bucket count follows
#   the duration, clamp(ceil(seconds / grWindowSeconds), grTraceBucketsMin, grTraceBucketsMax) — 4 ms up to about 4.4
#   minutes, wider after, and then the real window is printed with the numbers. printedQuantiles: p50 and p95, both, over
#   the ACTIVE windows (limiterActiveInputDb) — the windows the limiter has something to work on, so silence moves
#   neither; the landing's budget reads the same p95. The numbers are in the fields' names (p50Db, p95Db), so this list
#   is a checked claim, not a knob.
# pumping: the limiter's pumping, from its gain-reduction trace through two 2nd-order Butterworth filters, a high-pass at
#   highPassHz and a low-pass at lowPassHz; the first settleSeconds excluded; not measured when the trace runs slower than
#   minTraceRateHz (five samples per period of 8 Hz — a hypothesis).
[cost]
activityBelowIntegratedLu = 42
activityFloorLufs = -70
limiterActiveInputDb = -60
firstBlockSeconds = 3
blockSeconds = 0.1
histogramStepDb = 0.1
absoluteGateLufs = -70
relativeGateLu = -20
tooQuietBelowLufs = -55
grWindowSeconds = 0.004
grTraceBucketsMin = 1000
grTraceBucketsMax = 65536
printedQuantiles = [0.5, 0.95]
pumping = { highPassHz = 1, lowPassHz = 8, settleSeconds = 2, minTraceRateHz = 40 }

# THE FORM OF THE SONG, by sections. LRA keeps no order — "the chorus became quieter than the verse" is not in it — so the
# song is cut by the INPUT's short-term series: a reading that leaves the running mean of the open section by more than
# changeLu starts a new one; pieces shorter than minSeconds join the neighbour nearest in level; neighbours within changeLu
# merge. The sections answer only WHERE. The number is a continuous measure that knows no sections: every reading's shift
# once the overall gain ΔI (integrated output minus input) is removed, at its `quantile`, printed as measured beside the
# largest section's shift and where it is.
# changeLu 3 is a step heard as a change of part; minSeconds 8 — anything shorter is a phrase, not a part.
# NOT MEASURED — the validity of the measurement, not a verdict on the master: when fewer than minComparedShare of the
#   sections compare, or when the master is shorter than the source by more than masterShorterByAtMost. The largest
#   section's shift is located only when more than worstNamedAbove compare.
[cost.sections]
changeLu = 3
minSeconds = 8
masterShorterByAtMost = 0.1
minComparedShare = 0.5
worstNamedAbove = 2
quantile = 0.95

# THE DAMAGE THE PROCESSING DID, HEARD: PEAQ Basic (ITU-R BS.1387, analysis::Peaq) of the master against a reference —
# the same chain on the same path (the same stages, oversamplers, delays and order, the EQ, high-pass, mono bass, tilt,
# shelf and bands as the master has them) with its dynamics at rest: the glue in its exact bypass (ratio 1, the lookahead
# kept), and the whole chain fed referenceBelowDb lower (the input gain, within its own range), so the saturation runs in
# its small-signal line and the limiter and its needles never reach the ceiling. Both before the dither: the master is
# rendered once more without it, so a stage at rest leaves the two the same to the bit. One gain brings the reference to
# the master's integrated loudness, both measured here. Both chains run at 48 kHz, PEAQ's rate, from the source — at
# 48 kHz itself, or through a resampler of this core's own (a windowed sinc, resamplerTaps per phase, built from
# deterministic math) — as the crest's impact check runs at the source's rate.
# windowSeconds, hopSeconds: graded in windows, so a damaged chorus does not dissolve in six minutes — every hopSeconds a
#   window of windowSeconds, the last ones cut by the end (a programme shorter than one window is one window); the window
#   is a whole number of hops, at most four.
# gradeFloorsOdg: the BS.1116 impairment scale by ODG, the lower edge of grades 5, 4, 3 and 2 — the midpoints between the
#   scale's anchors 0 (5, imperceptible), -1 (4, perceptible but not annoying), -2 (3, slightly annoying), -3 (2, annoying)
#   and -4 (1, very annoying). The share of the track where the damage is heard is the share of its windows graded below 5.
[cost.damage]
windowSeconds = 10
hopSeconds = 5
gradeFloorsOdg = [-0.5, -1.5, -2.5, -3.5]
referenceBelowDb = 60
resamplerTaps = 32

# PROGRESS — an estimate, not a report: it may be wrong, and it may go back.
# analysis: the steps of the file's measurement, weighed by the milliseconds each took on a 240-second 48 kHz stereo
#   programme (referenceSeconds) — one measurement, and a hypothesis that a step's cost grows with the file's duration.
#   A step's "≈ N s" is shown from estimateFromSeconds up, rounded to the second.
[progress.analysis]
referenceSeconds = 240
estimateFromSeconds = 1

[progress.analysis.weights]
loudness = 449.51
report = 895.895
# The three crossover reports share one 5:22 FFT walk (1 712 ms total); one third is assigned to each result so
# publication of the already-finished companions does not make the bar jump.
lowEnd120 = 570.597
lowEnd150 = 570.597
forensics = 927.09
stereo = 108.662
lowEndSweep = 0.038
stereoBursts = 463.679
crest = 4501.161
hum = 1078.918
tempo = 337.33
waveformIndex = 140.0
excursionsIndex = 450.0

# master: the phases of a master — every landing pass weighs passWeight and the measurement of the delivered file
#   measureWeight, against expectedPasses passes; a max master's against its mode's own count: 7 for max clean, 6 for
#   max dense (an owner decision, 06.10).
[progress.master]
passWeight = 1
measureWeight = 0.15
expectedPasses = 3
expectedPassesMaxClean = 7
expectedPassesMaxDense = 6

# THE BLIND PAIRED PREFERENCE TEST — a development tool, never on a public page: its protocol. Two lanes A / B without
# labels at equal loudness, "A better / B better / no preference", revealed after the last answer. Nothing here feeds the
# cost; a person reads the results. The chains a pair compares are defined with the test itself, not here.
# targets: the two series, streaming and cdDynamic.
# fragmentSeconds: the fragment (a hypothesis: shorter and the glue is not heard, longer and answering tires), from the cue
#   mark or else the loudest short-term window of the source. repeats: every pair twice, in reverse order.
# matchToleranceLu: a fragment is matched by the A/B gain to the quieter of the two, measured by the same BS.1770 stream —
#   the landing's dead zone.
# listened.minSwitches (an owner decision): a pair counts as listened from this many switches of the voice; there is no
#   threshold in seconds.
[blindTest]
targets = ["allStreaming", "cdDynamic"]
fragmentSeconds = 20
repeats = 2
matchToleranceLu = 0.1
listened = { minSwitches = 2 }
