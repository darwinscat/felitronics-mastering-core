ru.few = "Где-то в цепочке сведения усечение до {bits} бит."
ru.many = "Где-то в цепочке сведения усечение до {bits} бит."
ru.other = "Где-то в цепочке сведения усечение до {bits} бита."
en.one = "Somewhere in the mix chain the audio was truncated to {bits} bit."
en.other = "Somewhere in the mix chain the audio was truncated to {bits} bits."

# ...and as an error: a mix of {bits} bits, to be mixed down again at {depth}, the full depth.
[messages.sourceShallowMix]
plural = "depth"
ru.one = "{bits}-битный микс — сведите в {depth} бит."
ru.few = "{bits}-битный микс — сведите в {depth} бита."
ru.many = "{bits}-битный микс — сведите в {depth} бит."
ru.other = "{bits}-битный микс — сведите в {depth} бита."
en.one = "A {bits}-bit mix — please mix it down at {depth} bit."
en.other = "A {bits}-bit mix — please mix it down at {depth} bits."

[messages.sourceLimitedBus]
ru = "Микс уже сжат лимитером (PLR {plr}) — мастеринг не вернёт динамику; пришлите версию без лимитера на шине."
en = "The mix is already squeezed by a limiter (PLR {plr}) — mastering will not bring the dynamics back; please send a version without the limiter on the bus."

[messages.sourceLossy]
ru = "Похоже, исходник прошёл через mp3/AAC (верх обрезан на {hz}) — мастерьте с исходника без потерь."
en = "The source seems to have gone through mp3/AAC (the top is cut at {hz}) — please master from a lossless source."

# The infra-low share as a note, then as a warning.
[messages.sourceInfraLowNote]
ru = "Немного энергии ниже {hz} — ФВЧ мастера её уберёт."
en = "A little energy below {hz} — the master's high-pass will remove it."

[messages.sourceInfraLowWarning]
ru = "Заметная часть энергии ниже {hz} ({share}) — ФВЧ её срежет, громкость и баланс микса изменятся; проверьте, что там: рокот, ветер, гул сабов."
en = "A notable part of the energy lies below {hz} ({share}) — the high-pass will cut it, and the mix's loudness and balance will change; please check what is there: rumble, wind, sub boom."

# The master's cost line by line, each published where its numbers were measured: the section that moved most (its shift
# and where it lies), how many sections were compared, the limiter's reduction and how much of the programme it worked
# in, and the impact loss in each band below the full band's.
[messages.masterCostSection]
ru = "Наибольший сдвиг секции: {shift} на отрезке {from}–{to}."
en = "The largest section shift is {shift}, at {from}–{to}."

[messages.masterCostSections]
ru = "Сопоставлено секций: {count}."
en = "Sections compared: {count}."

[messages.masterCostLimiter]
ru = "Срез лимитера в активных окнах: медиана {median}, P95 {p95}."
en = "Limiter reduction over the active windows: median {median}, P95 {p95}."

[messages.masterCostActive]
ru = "Лимитер работает в {limiter} окон; активных окон — {active}."
en = "The limiter works in {limiter} of the windows; {active} of the windows are active."

[messages.masterCostBands]
ru = "Потеря удара по полосам: низ {low}, нижняя середина {lowMid}, верхняя середина {highMid}, верх {high}."
en = "Impact loss by band: low {low}, low-mid {lowMid}, high-mid {highMid}, high {high}."

[messages.masterPeaksAboveCeiling]
ru = "Пики выше потолка: истинный пик мастера {truePeak} при потолке {ceiling}. Под потолком не вышел ни один вариант — отдан тот, что превышает его меньше всех."
en = "Peaks above the ceiling: the master's true peak is {truePeak} against a ceiling of {ceiling}. No render stayed under the ceiling, so the one that exceeds it least is delivered."

# The plan's advice: a device's value as it sounds, against the norm drawn on its knob.
[messages.hpfBelowComfort]
ru = "ФВЧ {cutoff} ниже комфортного окна {low}–{high}: так низко он только страхует от постоянной составляющей и не чистит низ."
en = "HPF {cutoff} is below the comfort window {low}–{high}: this low it only guards against DC and does not clean the low end."

[messages.hpfAboveComfort]
ru = "ФВЧ {cutoff} выше комфортного окна {low}–{high}: он забирает уже музыку, а не мусор."
en = "HPF {cutoff} is above the comfort window {low}–{high}: it takes music, not rubbish."

[messages.hpfSlopeGentle]
ru = "Крутизна ФВЧ {slope} дБ/окт мягче обычной (от {gentlest}): он плохо чистит низ и пологим склоном задевает музыку выше среза."
en = "An HPF slope of {slope} dB/oct is gentler than usual (from {gentlest}): it cleans the low end poorly, and its shallow slope reaches into the music above the cutoff."

[messages.hpfSlopeSteep]
ru = "Крутизна ФВЧ {slope} дБ/окт круче обычной (до {steepest}): после среза он звенит — крутой фильтр даёт выброс на частоте среза."
en = "An HPF slope of {slope} dB/oct is steeper than usual (up to {steepest}): it rings after the cutoff — a steep filter overshoots at the cutoff frequency."

[messages.eqOvershoot]
ru = "Кривая EQ за пределами нормы: {db} на {hz}."
en = "The EQ curve is beyond the norm: {db} at {hz}."

[messages.monoBassOutsideZones]
ru = "Моно-бас на {crossover} выше, чем нужно и клубу ({clubTo}), и винилу ({vinylTo})."
en = "Mono bass at {crossover} is higher than both a club ({clubTo}) and vinyl ({vinylTo}) need."

# The target's note: where its loudness comes from, where that is not a platform's published number or a standard.
[messages.targetMeasured]
ru = "{lufs} измерено на самой платформе, это не опубликованная спецификация."
en = "{lufs} is measured on the platform itself, not a published specification."

[messages.targetPractice]
ru = "{lufs} — практика мастеринга, а не стандарт."
en = "{lufs} is mastering practice, not a standard."

[messages.targetNoNormalisation]
ru = "Платформа не нормализует громкость: это пресет доставки, а не цель платформы."
en = "The platform does not normalise loudness: a delivery preset, not a platform target."

# Mono bass's crossover below every destination's zone: lower than a club or vinyl asks for.
[messages.monoBassBelowZones]
ru = "Моно-бас на {crossover} ниже, чем просят и клуб (от {clubFrom}), и винил (от {vinylFrom})."
en = "Mono bass at {crossover} is lower than both a club (from {clubFrom}) and vinyl (from {vinylFrom}) ask for."

[messages.masterLandingWall]
ru = "Сделано {achieved}. Дальше лимитеру пришлось бы срезать намного больше ради совсем небольшой прибавки громкости."
en = "Made at {achieved}. Going louder would take much more limiting for very little loudness."

# Diagnostic line only; the page shows masterLandingWall as the verdict.
[messages.masterLandingWallDetail]
ru = "Стена лимитера: {slope} LU на дБ среза, P95 {p95}."
en = "Limiter wall: {slope} LU per dB of cut, P95 {p95}."

[messages.rejectedClippedGain]
ru = "Микс клипует. Добавлять громкость можно только по вашему явному выбору: всё равно мастерить. Лучше экспортировать микс с запасом по пикам."
en = "The mix clips. Adding loudness needs your explicit choice to master it anyway. Exporting the mix with peak headroom is better."

[messages.sourceNoClipping]
ru = "Клиппинг не обнаружен."
en = "No clipping detected."

[messages.sourceClippingUnmeasured]
ru = "Клиппинг не проверен: {reason}."
en = "Clipping has not been checked: {reason}."

[messages.sourceRealClipping]
ru = "Микс клипует: искажения уже в файле, мастеринг их не уберёт. Экспортируйте микс с запасом, пики от −6 до −3 dBFS."
en = "The mix clips: the distortion is already in the file and mastering cannot undo it. Export the mix with headroom, peaks between −6 and −3 dBFS."

[messages.sourceInterSampleOvers]
ru = "Между отсчётами пики достигают {peak}, сами отсчёты не клипуют. Эти пики можно убрать простым понижением уровня."
en = "Peaks between samples reach {peak}; the samples themselves do not clip. A simple gain reduction can bring these peaks down."

[messages.sourceSampleOvers]
ru = "Есть отсчёты на полном уровне или выше. Проверьте запас по пикам; плоские вершины не обнаружены."
en = "Some samples reach or exceed full scale. Check the peak headroom; no flat tops were detected."

[messages.sourceAlreadyMastered]
ru = "Файл уже мастерен: громкость {loudness}, true peak {peak}. Ему уже не нужна ещё одна обработка без веской причины."
en = "This file is already mastered: loudness {loudness}, true peak {peak}. It needs no more processing without a good reason."

[messages.sourceFormerLossy]
ru = "Похоже, файл раньше был сжат с потерями. Для мастеринга лучше взять исходный lossless-микс."
en = "This file appears to have been lossy-compressed before. The original lossless mix is a better source for mastering."

[messages.sourceMasterLouder]
ru = "Цель громче исходника: это сильнее сплющит уже мастеренный файл. Лучше попросить исходный микс, но по Вашему выбору мы всё равно сделаем мастер."
en = "The target is louder than this already-mastered source, which means squashing it harder. Please ask for the original mix if possible; we can still master it at your request."

[messages.sourceDeliveryAsIs]
ru = "Ваш файл так прекрасен, что мы ослеплены блеском этого совершенства. Отдаём оригинал без единого изменения."
en = "Your file is so splendid that we are dazzled by its perfection. We will deliver the original without changing a single bit."

[messages.sourceDeliveryPeaksOnly]
ru = "Для стриминга снижать громкость не нужно — платформа сделает это сама. Оставляем мастеринг в покое и только даём пикам запас до {ceiling}: простой gain {gain}."
en = "There is no need to turn it down for streaming—the platform does that. We leave the mastering alone and only give the peaks headroom to {ceiling}, with a plain {gain} gain."
