# SPDX-License-Identifier: AGPL-3.0-or-later
#
# THE TEXT CATALOG of felitronics::session — every message a fact renders as, in every language the catalog declares.
# Compiled into the library at build time (felitronics_toml_embed) and checked by felitronics_session_text_check before
# the library is built (src/TextSchema.h has the rules); <felitronics/session/Text.h> says how a fact is rendered.
#
# HOW A MESSAGE IS WRITTEN
#   * [messages.<key>] — one per fact of src/TextFacts.h (the key is the fact's id where the catalog lacks a message).
#     Every declared language gives the WHOLE message: a sentence is never assembled from pieces, so each language
#     orders its words its own way.
#   * {name} places an argument — the names are the fact's, listed in src/TextFacts.h. Every language places the same
#     arguments; it may repeat one or put them in another order. No other brace may appear.
#   * plural = "<argument>": the words depend on a number. Each language then gives one text per CLDR category it has
#     (en: one, other; ru: one, few, many, other) — the category of the number as it is printed, so "1.0" is not "one".
#   * select = "<argument>": the words depend on a term (a platform, say). Each language gives one text per term of the
#     argument's group; the chosen term need not be printed, its text already says it.
#   * [terms.<group>.<key>] — the words a term argument prints.
#   * Numbers, units, signs and note names are the formatting table's (format.toml): a message never writes a unit or a
#     separator of its own.
#
# HOW IT IS TRANSLATED — as the site's texts are: Russian first, then English, then the rest in order. Polite or neutral,
# never familiar: a statement speaks impersonally or as "we"; a direct address takes the polite form (Russian: the
# imperative plural and a capitalised pronoun). The glossary's Latin terms stay Latin (LUFS, dBTP, True Peak, EQ, …).
#
# The facts' ids fall in ranges (<felitronics/session/Text.h>): readings and the landing, a command's rejection (one
# message per code of the state machine), and — to come — the phases of the work and the session's errors.

languages = ["ru", "en"]

# ── terms ──

[terms.platform]
web.ru = "веб-версия"
web.en = "web version"
desktop.ru = "десктоп-версия"
desktop.en = "desktop version"

# The fields a command's check can refuse, as the label a person knows the knob by — the site's own labels where it has
# one (Громкость / Loudness, Потолок / Ceiling, Срез ФВЧ / HPF corner, Моно ниже / Mono bass below, Компрессор (клей) /
# Compressor (glue), Баланс тона). A message puts the label first: "{field}: …", so no case of it is ever needed.
[terms.field]
targetLufs.ru = "Громкость"
targetLufs.en = "Loudness"
targetTp.ru = "Потолок"
targetTp.en = "Ceiling"
hpfFq.ru = "Срез ФВЧ"
hpfFq.en = "HPF corner"
hpfSlope.ru = "Крутизна ФВЧ"
hpfSlope.en = "HPF slope"
monoBassFq.ru = "Моно ниже"
monoBassFq.en = "Mono bass below"
monoBassWidth.ru = "Ширина моно-баса"
monoBassWidth.en = "Mono bass width"
glueUpToDb.ru = "Компрессор (клей)"
glueUpToDb.en = "Compressor (glue)"
saturationDrive.ru = "Драйв сатурации"
saturationDrive.en = "Saturation drive"
saturationMix.ru = "Микс сатурации"
saturationMix.en = "Saturation mix"
saturationOutput.ru = "Выход сатурации"
saturationOutput.en = "Saturation output"
tiltDb.ru = "Баланс тона"
tiltDb.en = "Tone balance"
limiterNeedles.ru = "Резать иглы"
limiterNeedles.en = "Cut needles"
limiterNeedlesDb.ru = "Порог игл"
limiterNeedlesDb.en = "Needle threshold"
lowDb.ru = "Низ"
lowDb.en = "Low"
audio.ru = "Звук"
audio.en = "Audio"

# ── messages ──

# A reading alone: the number with its unit, signs and bound, as the table writes it.
[messages.value]
ru = "{value}"
en = "{value}"

# The landing's progress: the pass being rendered, and how many the series has. A line of the geek's journal, not of
# the report a musician reads.
[messages.landingPass]
ru = "Посадка · проход {pass} из {passes}"
en = "Landing · pass {pass} of {passes}"

# The landing converged.
[messages.landingConverged]
plural = "passes"
ru.one = "посадка сошлась за {passes} проход"
ru.few = "посадка сошлась за {passes} прохода"
ru.many = "посадка сошлась за {passes} проходов"
ru.other = "посадка сошлась за {passes} прохода"
en.one = "landing: converged after {passes} pass"
en.other = "landing: converged after {passes} passes"

# The blind test: how many repeated pairs were answered the same way, of how many — the noun agrees with the second
# number, not the first.
[messages.pairsConsistent]
plural = "pairs"
ru.one = "согласованность повторов: {agreed} из {pairs} пары"
ru.few = "согласованность повторов: {agreed} из {pairs} пар"
ru.many = "согласованность повторов: {agreed} из {pairs} пар"
ru.other = "согласованность повторов: {agreed} из {pairs} пары"
en.one = "repeat consistency: {agreed} of {pairs} pair"
en.other = "repeat consistency: {agreed} of {pairs} pairs"

# The loudest note of the low end, as a MIDI number the table names.
[messages.loudestLowNote]
ru = "Самая громкая нота баса: {note}"
en = "Loudest bass note: {note}"

# Phase 1's warning of a wide bass: its side share. The owner's wording.
[messages.wideBass]
ru = "бас широкий (бока {side}) — моно-бас соберёт его, если включён; на наушниках станет уже"
en = "the bass is wide (side {side}) — mono bass will gather it if it is on; on headphones it will sound narrower"

# A file above the highest rate this platform takes. The web version sends it to the desktop version.
[messages.rateAboveLimit]
select = "platform"
ru.web = "Файл — {rate}. Всё, что выше {limit}, — для десктоп-версии."
ru.desktop = "Файл — {rate}. Всё, что выше {limit}, движок не принимает."
en.web = "This file is {rate}. Above {limit} is for the desktop version."
en.desktop = "This file is {rate}. The engine takes nothing above {limit}."

# ── a command's rejection ──
# What was refused and why, one message per code of the state machine (Commands.h, Rejection); the shell shows it where
# the command came from. Nothing here names the command: the person has just given it.

[messages.rejectedFloatingPointEnvironment]
ru = "Команда пришла из потока, который считает не по правилам IEEE-754 (обнуляет денормализованные числа или округляет не к ближайшему), — на таком потоке движок не работает."
en = "The command came from a thread whose arithmetic is not IEEE-754's default (it flushes subnormals to zero or does not round to nearest) — the engine does not work on such a thread."

[messages.rejectedNoSource]
ru = "Файл ещё не загружен — сначала загрузите его."
en = "No file is loaded yet — load one first."

[messages.rejectedNotPlaced]
ru = "Приборы ещё не расставлены: идёт первый замер. Править их можно, когда он закончится."
en = "The devices are not placed yet: the first measurement is running. They can be edited once it ends."

[messages.rejectedNotMeasured]
ru = "Первый замер ещё идёт — мастер можно сделать, когда он закончится."
en = "The first measurement is still running — a master can be made once it ends."

[messages.rejectedBusy]
ru = "Мастер уже делается — дождитесь его или отмените."
en = "A master is already being made — wait for it or cancel it."

[messages.rejectedNoJob]
ru = "Отменять нечего: замер или мастер сейчас не выполняется."
en = "Nothing to cancel: no measurement or master is running."

[messages.rejectedNoMaster]
ru = "Готовых мастеров нет — убирать нечего."
en = "No master is kept — there is nothing to remove."

[messages.rejectedUnknownTarget]
ru = "Такой цели нет."
en = "There is no such target."

[messages.rejectedNotOffered]
ru = "Этот прибор здесь не предлагается: этой цели или этому файлу он не нужен."
en = "This device is not offered here: this target or this file does not call for it."

[messages.rejectedUnknownJob]
ru = "Это задание уже не выполняется — отменять нечего."
en = "That job is no longer running — there is nothing to cancel."

[messages.rejectedUnknownMaster]
ru = "Такого мастера среди готовых нет."
en = "No such master is kept."


[messages.rejectedNotFinite]
ru = "{field}: не число — принимается только конечное значение."
en = "{field}: not a number — only a finite value is taken."

[messages.rejectedNotOneOf]
ru = "{field}: у этой ручки нет такого значения."
en = "{field}: this knob has no such value."

[messages.rejectedOutOfDomain]
ru = "{field}: значение вне допустимого диапазона."
en = "{field}: the value is outside the accepted domain."

[messages.rejectedBadChannels]
ru = "Движок принимает звук в одном или двух каналах, а в этом файле их другое число."
en = "The engine takes audio in one or two channels; this file has another number of them."

[messages.rejectedBadRate]
ru = "Частота дискретизации файла ниже той, с которой работает движок."
en = "The file's sample rate is below the lowest the engine works at."

[messages.rejectedNoAudio]
ru = "В файле нет звука: ни одного отсчёта."
en = "The file holds no audio: not a single sample."

[messages.rejectedTooLong]
ru = "Файл слишком длинный: этой машине не хватит адресуемой памяти, чтобы его принять."
en = "The file is too long: this machine cannot address the memory it needs."

[messages.rejectedNoJobId]
ru = "Номера заданий этой сессии исчерпаны — загрузить файл или сделать новый мастер в ней уже нельзя."
en = "This session has used up its job numbers — it cannot load a file or make a new master."

[messages.rejectedInvalidUtf8]
ru = "Имя файла содержит некорректный UTF-8 — проверьте его кодировку."
en = "The file name contains invalid UTF-8 — check its encoding."

# The phases of the work. A pass names only its current number, never a budget.
[messages.measurement1]
ru = "Первый замер завершён."
en = "The first measurement is complete."

[messages.measurement2]
ru = "Второй замер завершён."
en = "The second measurement is complete."

[messages.masterPass]
