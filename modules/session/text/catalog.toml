# Held short by the limiter's budget (owner, 04.10: loudness is a request, not an order): the target, the level landed
# and the budget, the P95 the report's limiter line prints.
[messages.masterLandingBudget]
ru = "Цель {target}, сделано {achieved}: дальше лимитеру пришлось бы срезать больше {budget} (P95)."
en = "Target {target}, reached {achieved}: going further, the limiter would have to take off more than {budget} (P95)."

# No render kept the limiter's budget: the gentlest ceiling-safe one is delivered, and what its limiter takes is said
# beside the budget it broke.
[messages.masterLandingOverBudget]
ru = "Цель {target}, сделано {achieved}: ни один вариант не уложился в бюджет лимитера {budget} (P95) — выдан самый мягкий из опробованных, лимитер в нём срезает {taken}."
en = "Target {target}, reached {achieved}: no render kept within the limiter's budget of {budget} (P95) — the gentlest of those tried is delivered, its limiter takes off {taken}."

# A landing on the source's gate: the master's mean level over the blocks the source's gate admits — the programme without
# its quiet parts, not its loudest place — and the file's standard BS.1770 reading, where the two part by more than the
# tolerance, either way round.
[messages.masterLandingGate]
ru = "Без тихих мест {loud}, по стандарту файла {file}."
en = "{loud} without the quiet parts, {file} by the file's standard reading."

# A max mode's verdict (owner, 04.10: loudness by a promise of BS.1116): the mode, the file's loudness and what ended the
# mode. The damage's own line says the grade.
[messages.masterMaxBudget]
ru = "{mode}: {achieved} — дальше лимитеру пришлось бы срезать больше {budget} (P95), это предел режима."
en = "{mode}: {achieved} — further, the limiter would have to take off more than {budget} (P95), the mode's limit."

# v0.15.0's PEAQ guard stepping the drive back, and running out of steps: no longer said (v0.16.0: no guard in the loop),
# kept for the facts' numbers.
[messages.masterMaxGuard]
ru = "{mode}: {achieved} — страж PEAQ отступил по громкости (шагов назад: {steps}), чтобы порча осталась в обещании режима."
en = "{mode}: {achieved} — the PEAQ guard stepped the loudness back ({steps} steps) to keep the damage within the mode's promise."

[messages.masterMaxGuardUnmet]
ru = "{mode}: {achieved} — порча не уложилась в обещание режима и после отступа по громкости (шагов назад: {steps}); выдан самый мягкий из опробованных вариантов."
en = "{mode}: {achieved} — the damage stayed beyond the mode's promise even with the loudness stepped back ({steps} steps); the gentlest render tried is delivered."

[messages.masterMaxCeiling]
ru = "{mode}: {achieved} — достигнут потолок поиска режима, бюджет лимитера и порча в пределах обещания."
en = "{mode}: {achieved} — the mode's search ceiling is reached, within the limiter's budget and the damage promise."

[messages.masterMaxPasses]
ru = "{mode}: {achieved} — проходы кончились раньше, чем поиск дошёл до предела режима."
en = "{mode}: {achieved} — the passes ran out before the search reached the mode's limit."

[messages.masterMaxTruePeak]
ru = "{mode}: {achieved} — ни один вариант не удержался под потолком истинного пика."
en = "{mode}: {achieved} — no render kept under the true-peak ceiling."

# A max master whose render v0.15.0's PEAQ guard could not grade: the limiter's budget held, the damage unchecked. No longer
# said (v0.16.0: no guard in the loop), kept for the fact's number.
[messages.masterMaxUnguarded]
ru = "{mode}: {achieved} — порчу проверить не удалось: PEAQ не оценил этот файл; бюджет лимитера соблюдён."
en = "{mode}: {achieved} — the damage could not be checked: PEAQ did not grade this file; the limiter's budget holds."

# A max master delivered over the mode's limiter budget: no render kept it.
[messages.masterMaxOverBudget]
ru = "{mode}: {achieved} — лимитер в выданном варианте срезает {over} (P95), больше бюджета режима {budget}."
en = "{mode}: {achieved} — the limiter takes off {over} (P95) in the render delivered, more than the mode's budget of {budget}."

# A max master pulled up to [landing.max] floorLufs (owner, 04.10: "always pulled up to −14"): the mode and the level, as a
