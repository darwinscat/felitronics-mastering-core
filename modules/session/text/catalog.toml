asym.en = "Diode (asymmetric)"
cubic.ru = "Диод (симметричный)"
cubic.en = "Diode (symmetric)"

# The BS.1116 impairment scale, as the damage's line names the worst window's grade (5 down to 1).
[terms.damageGrade]
imperceptible.ru = "не слышно"
imperceptible.en = "imperceptible"
perceptible.ru = "слышно, но не мешает"
perceptible.en = "perceptible but not annoying"
