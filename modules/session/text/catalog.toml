glueMix.en = "Mix"
glueThresholdDb.ru = "Threshold"
glueThresholdDb.en = "Threshold"
glueRatio.ru = "Ratio"
glueRatio.en = "Ratio"
glueKneeDb.ru = "Knee"
glueKneeDb.en = "Knee"
glueAttackMs.ru = "Attack"
glueAttackMs.en = "Attack"
glueReleaseMs.ru = "Release"
glueReleaseMs.en = "Release"
saturationDrive.ru = "Драйв сатурации"
saturationDrive.en = "Saturation drive"
saturationMix.ru = "Микс сатурации"
saturationMix.en = "Saturation mix"
saturationType.ru = "Тип сатурации"
saturationType.en = "Saturation type"
limiterNeedles.ru = "Резать иглы"
limiterNeedles.en = "Cut needles"
limiterNeedlesDb.ru = "Срез с пиков"
limiterNeedlesDb.en = "Cut off the peaks"
limiterReleaseMs.ru = "Release"
limiterReleaseMs.en = "Release"
limiterLookaheadMs.ru = "Lookahead"
limiterLookaheadMs.en = "Lookahead"
limiterOversampling.ru = "Oversampling"
limiterOversampling.en = "Oversampling"
