# The limiter's line: its ceiling and what the peak clipper inside it does with the needles, as it sounds. "Clipped down
# to" is the threshold: what stands further above the ceiling than that is cut to it, and the limiter takes the rest.
[messages.limiterShort]
ru = "Лимитер: потолок {ceiling}. Иглы короткие (90 % не длиннее {p90}, бас в дозе {bass}, PLR {plr}) — клиппер срезает их до {over} над потолком."
en = "Limiter: ceiling {ceiling}. The needles are short (90 % no longer than {p90}, bass share of the dose {bass}, PLR {plr}) — the peak clipper cuts them down to {over} above the ceiling."

[messages.limiterBetween]
ru = "Лимитер: потолок {ceiling}. Иглы средние (90 % не длиннее {p90}, бас в дозе {bass}, PLR {plr}) — клиппер срезает их осторожно, до {over} над потолком."
en = "Limiter: ceiling {ceiling}. The needles are neither short nor long (90 % no longer than {p90}, bass share of the dose {bass}, PLR {plr}) — the peak clipper cuts them with care, down to {over} above the ceiling."

[messages.limiterManual]
ru = "Лимитер: потолок {ceiling}. Иглы срезаются по ручной настройке — до {over} над потолком."
en = "Limiter: ceiling {ceiling}. The needles are cut by a manual setting — down to {over} above the ceiling."

[messages.limiterNeedlesOff]
ru = "Лимитер: потолок {ceiling}. Клиппер игл выключен."
en = "Limiter: ceiling {ceiling}. The peak clipper is off."

[messages.limiterLittleNeed]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: нужда {need} — не больше {little}."
en = "Limiter: ceiling {ceiling}. The needles are not cut: the need is {need}, no more than {little}."

[messages.limiterNoExcursions]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: пиков выше потолка нет."
en = "Limiter: ceiling {ceiling}. The needles are not cut: no peak stands above the ceiling."

[messages.limiterUnmeasured]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: они не измерены."
en = "Limiter: ceiling {ceiling}. The needles are not cut: they were not measured."

[messages.limiterClipped]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: источник клипован (клипов в минуту: {rate}) — клиппер добавил бы искажений."
en = "Limiter: ceiling {ceiling}. The needles are not cut: the source is clipped (clips per minute: {rate}) — a clipper would add distortion."

[messages.limiterLowPlr]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: PLR входа {plr} — меньше {bound}, материал уже ограничен."
en = "Limiter: ceiling {ceiling}. The needles are not cut: the input's PLR is {plr}, under {bound} — the material is already limited."

[messages.limiterBass]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: в выбросах много баса (доля в дозе {bass})."
en = "Limiter: ceiling {ceiling}. The needles are not cut: the excursions carry much bass ({bass} of the dose)."

[messages.limiterLong]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: выбросы длинные (90 % не длиннее {p90})."
en = "Limiter: ceiling {ceiling}. The needles are not cut: the excursions are long (90 % no longer than {p90})."

[messages.limiterNoClipper]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: у этой цели клиппера игл нет."
en = "Limiter: ceiling {ceiling}. The needles are not cut: this target has no peak clipper."

[messages.limiterQuiet]
ru = "Лимитер: потолок {ceiling}. Иглы не режутся: вход слишком тихий для замера."
en = "Limiter: ceiling {ceiling}. The needles are not cut: the input is too quiet to measure."

[messages.limiterPending]
ru = "Лимитер: потолок {ceiling}. Иглы ещё измеряются."
en = "Limiter: ceiling {ceiling}. The needles are still being measured."

[messages.limiterPlain]
ru = "Лимитер: потолок {ceiling}."
en = "Limiter: ceiling {ceiling}."

