# it takes is the landing's to decide, the limiter takes the rest.
[messages.limiterShort]
ru = "Лимитер: потолок {ceiling}. Иглы короткие (90 % не длиннее {p90}, бас в дозе {bass}, PLR {plr}) — клиппер снимет с пиков не больше {cut}, остальное возьмёт лимитер."
en = "Limiter: ceiling {ceiling}. The needles are short (90 % no longer than {p90}, bass share of the dose {bass}, PLR {plr}) — the peak clipper will take no more than {cut} off the peaks, the limiter will take the rest."

[messages.limiterBetween]
