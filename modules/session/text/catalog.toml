[messages.masterVinylReady]
ru = "Мастер готов к нарезке: кардинальных правок (моно-бас, инфранизы, пики) не потребует. RIAA и уровень по длине стороны — за резчиком."
en = "The master is ready for cutting: it will need no cardinal corrections (mono bass, infra-low, peaks). RIAA and the level for the side's length are the cutting engineer's."

[messages.masterVinylDeparts]
ru = "Готовность к нарезке не подтверждена: настройки отступают от правил винила (моно-бас, ФВЧ, потолок или иглы)."
en = "Readiness for cutting is not confirmed: the settings depart from the rules of vinyl (mono bass, the high-pass, the ceiling or the needles)."

[messages.masterVinylChecked]
ru = "Проверено по файлу: бас в моно ниже {crossover}, инфраниз срезан от {cutoff}, True Peak {peak} — не выше {ceiling}."
en = "Checked on the file: the bass is mono below {crossover}, the infra-low is cut from {cutoff}, True Peak {peak} is no higher than {ceiling}."

[messages.masterVinylUncheckable]
ru = "По файлу не проверяется: длина стороны, свистящие на резце, искажения к центру пластинки. Это не сертификат."
en = "A file cannot show: the side's length, sibilance at the cutter, distortion towards the centre of the disc. This is not a certificate."

[messages.masterQuietInput]
ru = "Вход очень тихий ({lufs}): подняли на {gain}, шум поднялся вместе с музыкой. Кроме ФВЧ на полу цели и дизера формата, машина приборов не ставила — на таком уровне замер ненадёжен; включить их можно вручную."
en = "The input is very quiet ({lufs}): it was raised by {gain}, and the noise rose with the music. Apart from the high-pass at the target's floor and the format's dither the machine placed no device — at this level a measurement is unreliable; they can be switched on by hand."

[messages.glueUnavailable]
ru = "Клей недоступен: громкие места песни не измерены (нет P95 кратковременной громкости). Мастер будет сделан без клея; значение «до {upTo}» сохранено."
en = "Glue is unavailable: the song's loud places were not measured (no short-term loudness P95). The master will be made without glue; the value “up to {upTo}” is kept."

[messages.glueTempoFallback]
ru = "Темп не измерен уверенно — восстановление клея рассчитано на {bpm}."
en = "The tempo was not measured with confidence — the glue release is set for {bpm}."

[messages.glueReleaseHeld]
ru = "Восстановление клея — {release}: темп просил {asked}, это за пределом прибора."
en = "Glue release is {release}: the tempo asked for {asked}, which is outside the device's range."

[messages.masterGlue]
ru = "Клей снял {usual} на громких местах, самое большее — {largest}."
en = "Glue took {usual} off the loud places, {largest} at most."

[messages.masterSaturation]
ru = "Сатурация срезала пики до {largest} (обычно {usual})."
en = "Saturation cut peaks by up to {largest} (usually {usual})."

[messages.planWaiting]
ru = "Мастер ждёт замер «{analyzer}» для прибора «{device}»: {progress}"
en = "The master is waiting for the {analyzer} measurement for {device}: {progress}"

[messages.masterReady]
ru = "Мастер готов."
en = "The master is ready."

[messages.masterLandingMiss]
ru = "Мастер вышел на {achieved} при цели {target}; недобор {gap}. Это безопасный результат, если истинный пик в пределах потолка."
en = "The master reached {achieved} against a target of {target}; the shortfall is {gap}. This is a safe result when true peak stays under the ceiling."

[messages.masterLandingAbove]
ru = "Мастер вышел на {achieved} при цели {target}; превышение по громкости {gap}. Истинный пик остаётся в пределах потолка."
en = "The master reached {achieved} against a target of {target}; loudness is {gap} above target. True peak remains under the ceiling."

[messages.masterHintSubBass]
ru = "На саб-бас приходится {share} энергии. Если нужна большая громкость, уберите лишнее ниже 60–80 Гц или настройте сайдчейн баса и бочки."
en = "Sub-bass carries {share} of the energy. For more loudness, reduce excess below 60–80 Hz or adjust bass and kick sidechain."

[messages.masterHintPeaks]
ru = "Лимитер снял до {reduction} на резких пиках. Если нужна большая громкость, прижмите транзиенты в миксе."
en = "The limiter reduced sharp peaks by up to {reduction}. For more loudness, tame transients in the mix."

[messages.masterHintDark]
ru = "Доля присутствия 2–8 кГц составляет {share}. Если нужна большая громкость, добавьте присутствия в миксе."
en = "The 2–8 kHz presence share is {share}. For more loudness, add presence in the mix."

[messages.masterHintDemand]
ru = "До цели остаётся {gap}; явной отдельной помехи замер не нашёл. Можно выбрать более тихую цель."
en = "The target remains {gap} away; the measurements found no single dominant obstacle. A quieter target may suit this mix."

[messages.masterHintGainRange]
ru = "Для выбранного прохода потребовалось {gain} предварительного усиления. Проверьте входной уровень и цель."
en = "The chosen pass used {gain} of pre-limiter gain. Check the input level and target."

[messages.masterHintTruePeak]
ru = "Измеренный истинный пик составил {peak}. Проверьте потолок пиков перед выдачей файла."
en = "Measured true peak reached {peak}. Check the peak ceiling before delivery."

[messages.masterCrestSourceRate]
ru = "Удар измерен на дополнительном проверочном проходе с частотой источника {rate}; громкость и истинный пик относятся к доставленному звуку."
en = "Impact was measured on one additional check pass at the source rate of {rate}; loudness and true peak describe delivered audio."

[messages.masterCrestDelivered]
ru = "Удар измерен на доставленном звуке с частотой {rate}."
en = "Impact was measured on delivered audio at {rate}."

[messages.masterCrestPending]
ru = "Сравнение удара ожидает замера исходника."
en = "Impact comparison is waiting for the source measurement."

[messages.masterCrestUnavailable]
ru = "Сравнение удара недоступно; готовый мастер сохраняется, если его громкость и истинный пик пригодны."
en = "Impact comparison is unavailable; the completed master remains available when its loudness and true peak are valid."

[messages.masterCostShape]
ru = "Отклонение формы громкости в 95-м процентиле: {shift}."
en = "The 95th percentile of loudness-shape deviation is {shift}."

[messages.masterCostCrest]
ru = "Потеря удара в худших 5 % пригодных окон: {loss}."
en = "Impact loss in the worst 5% of suitable windows is {loss}."

[messages.masterCostPumping]
ru = "Качание лимитера в полосе 1–8 Гц: {level}."
en = "Limiter pumping in the 1–8 Hz band is {level}."

[messages.masterCostK2Deferred]
ru = "Изменение тембра пока не измеряется."
en = "Tonal change is not measured yet."

[messages.masterCostUnavailable]
ru = "Часть чисел цены мастера недоступна для этой записи."
en = "Some master-cost measurements are unavailable for this programme."

[messages.masterReportUnavailable]
ru = "Обязательный замер готового мастера недоступен; файл не выдаётся."
en = "The completed master's required measurement is unavailable; no file is delivered."

[messages.cancelled]
ru = "Задание отменено."
en = "The job was cancelled."

# The session's errors. Recovery is a separate event field, never inferred from these words.
[messages.sessionTrap]
ru = "Выполнение сессии прервано из-за сбоя."
en = "The session stopped because execution failed."

[messages.sessionContract]
ru = "Задание остановлено: нарушены условия работы сессии."
en = "The job stopped because the session's contract was violated."

[messages.sessionRefusal]
ru = "Шаг не выполнен: арифметика потока не соответствует правилам IEEE-754. Восстановите настройки потока, чтобы продолжить."
en = "The step was refused: the thread's arithmetic is not IEEE-754's default. Restore the thread's settings to continue."

[messages.sessionMemory]
ru = "Недостаточно памяти для выполнения операции."
en = "There is not enough memory to perform the operation."

[messages.sessionPoisoned]
ru = "После сбоя эта сессия больше не принимает команды."
en = "This session no longer accepts commands after a failure."

[messages.sessionStale]
ru = "Результат относится к заданию, которое уже не выполняется."
en = "The result belongs to a job that is no longer running."

[messages.rejectedProjectTooLarge]
ru = "Текст проекта превышает допустимый размер."
en = "The project text exceeds the size limit."

[messages.rejectedProjectSyntax]
ru = "В проекте некорректный TOML."
en = "The project contains invalid TOML."

[messages.rejectedProjectMissing]
ru = "В проекте отсутствует обязательное поле."
en = "A required project field is missing."

[messages.rejectedProjectType]
ru = "У поля проекта неверный тип."
en = "A project field has the wrong type."

[messages.rejectedProjectUnknownKey]
ru = "В проекте неизвестный раздел, поле или суффикс автора."
en = "The project contains an unknown section, field or author suffix."

[messages.rejectedUnknownDefaults]
ru = "В этом ядре нет версии умолчаний, указанной в проекте."
en = "This core does not carry the project’s defaults version."

[messages.rejectedProjectCore]
ru = "Версия ядра в проекте должна иметь вид major.minor.patch."
en = "The project’s core version must have the form major.minor.patch."

[messages.machineDifferences]
plural = "count"
ru.one = "Сейчас машина решила бы иначе в {count} месте. Слой машины сохранён."
ru.few = "Сейчас машина решила бы иначе в {count} местах. Слой машины сохранён."
ru.many = "Сейчас машина решила бы иначе в {count} местах. Слой машины сохранён."
ru.other = "Сейчас машина решила бы иначе в {count} местах. Слой машины сохранён."
en.one = "The machine would decide differently today in {count} place. The saved machine layer is retained."
en.other = "The machine would decide differently today in {count} places. The saved machine layer is retained."

[messages.defaultsConverted]
ru = "Проект с версией умолчаний {version} сконвертирован: значения, заданные вручную, и числа цели сохранены; машинные значения выставлены заново по текущим правилам."
en = "The project from defaults version {version} was converted: the values set by hand and the target's numbers were kept; the machine's values were placed again by the current rules."

[messages.rejectedNewerDefaults]
ru = "Проект использует более новую версию умолчаний, которой нет в этом ядре."
en = "The project uses a newer defaults version that this core does not carry."

[messages.rejectedRateAboveLimit]
ru = "Частота источника выше предела оболочки."
en = "The source sample rate exceeds the shell's limit."

[messages.rejectedMemory]
ru = "Для команды недостаточно памяти."
en = "The command exceeds the memory ceiling."

[messages.convert]
ru = "Преобразование частоты"
en = "Converting sample rate"

[messages.lra]
ru = "Диапазон громкости"
en = "Loudness range"

[messages.final]
ru = "Завершение"
en = "Finalizing"

[messages.rejectedContract]
ru = "Неверный формат команды."
en = "The command format is invalid."

[messages.sameCoreMachineDifferences]
plural = "count"
ru.one = "Сейчас машина решила бы иначе в {count} месте. При той же версии ядра это обычно означает, что файл проекта правили вручную; сохранённые решения остаются."
ru.few = "Сейчас машина решила бы иначе в {count} местах. При той же версии ядра это обычно означает, что файл проекта правили вручную; сохранённые решения остаются."
ru.many = "Сейчас машина решила бы иначе в {count} местах. При той же версии ядра это обычно означает, что файл проекта правили вручную; сохранённые решения остаются."
ru.other = "Сейчас машина решила бы иначе в {count} местах. При той же версии ядра это обычно означает, что файл проекта правили вручную; сохранённые решения остаются."
en.one = "The machine would decide differently in {count} place today. With the same core version, this usually means the project file was edited by hand; the saved decisions are kept."
en.other = "The machine would decide differently in {count} places today. With the same core version, this usually means the project file was edited by hand; the saved decisions are kept."


