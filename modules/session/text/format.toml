#
# THE FORMATTING TABLE of felitronics::session — how each of the twelve languages writes a number, as data. The one table
# the session's renderer reads (src/Text.cpp, through <felitronics/session/Text.h>), compiled into the library at build
# time (felitronics_toml_embed) and checked by felitronics_session_text_check before the library is built: every
# language has a row and every unit a pattern for it, or the build is red (src/TextSchema.h has the rules).
#
# Where the numbers come from:
#   decimal, group, minimumGrouping  CLDR 48, as ICU 78 formats them: the decimal sign; the grouping separator, a
#                                    no-break space where CLDR has one (U+00A0; French the narrow U+202F); and the fewest
#                                    digits the leading group must have before a number is grouped at all — 2 in es, it
#                                    and pl, where 1234 stays 1234 and 12 345 is grouped.
#   minus, plus                      The Unicode minus U+2212 in every language (the mastering-core architecture, §6), not
#                                    the hyphen: a negative LUFS reads as a number, not a dash.
#   atLeast, atMost                  A bound, before the number: "≥ 6 %" — the sign and a no-break space (French: the
#                                    narrow one), so the bound never wraps away from its number.
#   absent                           What a value that is not a number prints, alone: the em dash.
#                                    The gate holds the fixed signs to exactly these (minus U+2212, absent U+2014, "≥" or
#                                    "≤" with a no-break space), and no sign may hold a digit or be a separator.
#   notes                            The names of the twelve pitch classes from C, with sharps: a note has no key to
#                                    spell a flat from. Three systems, each the one the site's key finder writes in that
#                                    language: letters; the German system (de, cs, pl), where B natural is H; solfège (it,
#                                    ro). The octave is scientific pitch notation (MIDI 60 is C4) and is added by the
#                                    renderer.
#   [units.*]                        Where the number goes ({n}) and the unit's sign. Percent after CLDR 48 (Turkish
#                                    before the number, "%45"; French with the narrow no-break space, the owner's decision
#                                    of 2026-09-12 for the site). A unit sign after a NO-BREAK space, U+00A0 in every
#                                    language, so "−14" and "LUFS" never wrap apart (French: the narrow U+202F, where CLDR
#                                    has it); the gate refuses a breaking space in any pattern. The glossary's Latin stays
#                                    Latin in every language (LUFS, dBTP,
#                                    dBFS, LU, BPM); Russian and Ukrainian write dB, Hz, kHz, ms and s in Cyrillic, as
#                                    the site's Russian mastering pages do; Turkish seconds are "sn", as the site writes
#                                    them.
#
# The rows of the languages the catalog does not declare yet (every one but en and ru) are CLDR's and the site's; each is
# read again when its language's catalog lands.

# ── numbers ──

[numbers.en]   # notes: letters
decimal = "."
group = ","
minimumGrouping = 1
minus = "\u2212"
plus = "+"
atLeast = "≥\u00A0"
atMost = "≤\u00A0"
absent = "—"
notes = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"]

